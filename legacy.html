                                const statusText = project.workflowStatus;
                                const statusWidth = pdf.getTextWidth(statusText) + 8;
                                drawRoundedRect(margin + contentWidth - statusWidth - 5, yPos + 3, statusWidth, 7, 2, statusColors.bg);
                                pdf.setFontSize(7);
                                pdf.setTextColor(...statusColors.text);
                                pdf.text(statusText, margin + contentWidth - statusWidth - 1, yPos + 8);

                                // Owner, team, due date row
                                pdf.setFontSize(8);
                                pdf.setTextColor(...grayText);
                                let infoText = `${project.owner} · ${project.team}`;
                                if (project.date) {
                                    const dueDate = new Date(project.date);
                                    const isOverdue = dueDate < new Date() && project.workflowStatus !== 'Done';
                                    infoText += ` · Due: ${dueDate.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })}`;
                                    if (isOverdue) {
                                        // Will show in red for the due date portion
                                        pdf.setTextColor(...grayText);
                                        pdf.text(`${project.owner} · ${project.team} · `, margin + 5, yPos + 14);
                                        const prefixWidth = pdf.getTextWidth(`${project.owner} · ${project.team} · `);
                                        pdf.setTextColor(239, 68, 68);
                                        pdf.text(`Due: ${dueDate.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })}`, margin + 5 + prefixWidth, yPos + 14);
                                    } else {
                                        pdf.text(infoText, margin + 5, yPos + 14);
                                    }
                                } else {
                                    pdf.text(infoText, margin + 5, yPos + 14);
                                }

                                let currentY = yPos + 18;

                                // Description
                                if (project.caption) {
                                    pdf.setFontSize(8);
                                    pdf.setTextColor(...grayText);
                                    const desc = project.caption.length > 150 ? project.caption.substring(0, 150) + '...' : project.caption;
                                    pdf.text(desc, margin + 5, currentY);
                                    currentY += 8;
                                }

                                // Subtasks list
                                if (hasSubtasks) {
                                    currentY += 2;
                                    pdf.setFontSize(7);
                                    pdf.setTextColor(...oceanMid);
                                    const completed = project.subtasks.filter(s => s.completed).length;
                                    pdf.text(`Subtasks (${completed}/${project.subtasks.length})`, margin + 5, currentY);
                                    currentY += 5;

                                    project.subtasks.forEach((subtask, sIdx) => {
                                        pdf.setFontSize(7);
                                        if (subtask.completed) {
                                            pdf.setTextColor(34, 197, 94); // green-500
                                            pdf.text(`[x] ${subtask.title}`, margin + 10, currentY);
                                        } else {
                                            pdf.setTextColor(...grayText);
                                            pdf.text(`[ ] ${subtask.title}`, margin + 10, currentY);
                                        }
                                        currentY += 5;
                                    });
                                }

                                yPos += cardHeight + 4;
                            });
                        }

                        yPos += 5;
                    }

                    // === KEY HIGHLIGHTS ===
                    if (reportData.sections.keyHighlights) {
                        const highlightsCount = reportData.autoHighlights?.length || 0;
                        const narrativeLines = reportData.narratives.keyHighlights ? Math.ceil(reportData.narratives.keyHighlights.length / 80) : 0;
                        const highlightsCardHeight = 28 + (highlightsCount * 6) + (narrativeLines * 5) + 10;
                        checkPageBreak(highlightsCardHeight + 5);

                        // Draw card
                        drawCard(margin, yPos, contentWidth, highlightsCardHeight);

                        // Section header inside card
                        pdf.setFont('helvetica', 'bold');
                        pdf.setFontSize(14);
                        pdf.setTextColor(...oceanDark);
                        pdf.text('Key Highlights', margin + cardPadding, yPos + 10);
                        pdf.setFont('helvetica', 'normal');
                        pdf.setFontSize(9);
                        pdf.setTextColor(...grayText);
                        pdf.text('Achievements and wins this period', margin + cardPadding, yPos + 16);
                        yPos += 22;

                        // Auto-detected
                        if (reportData.autoHighlights && reportData.autoHighlights.length > 0) {
                            reportData.autoHighlights.forEach(h => {
                                pdf.setFontSize(9);
                                pdf.setTextColor(...greenColor);
                                pdf.text(`+ ${h}`, margin + cardPadding, yPos);
                                yPos += 5;
                            });
                            yPos += 3;
                        }

                        // Narrative
                        if (reportData.narratives.keyHighlights) {
                            yPos += 2;
                            pdf.setFontSize(9);
                            pdf.setTextColor(...grayText);
                            const lines = pdf.splitTextToSize(reportData.narratives.keyHighlights, contentWidth - (cardPadding * 2));
                            lines.forEach(line => {
                                pdf.text(line, margin + cardPadding, yPos);
                                yPos += 4;
                            });
                        }
                        yPos += 10;
                    }

                    // === BLOCKERS & RISKS ===
                    if (reportData.sections.blockersRisks) {
                        const blockersCount = reportData.autoBlockers?.length || 0;
                        const blockerNarrativeLines = reportData.narratives.blockersRisks ? Math.ceil(reportData.narratives.blockersRisks.length / 80) : 0;
                        const blockersCardHeight = 28 + (blockersCount * 6) + (blockerNarrativeLines * 5) + 10;
                        checkPageBreak(blockersCardHeight + 5);

                        // Draw card
                        drawCard(margin, yPos, contentWidth, blockersCardHeight);

                        // Section header inside card
                        pdf.setFont('helvetica', 'bold');
                        pdf.setFontSize(14);
                        pdf.setTextColor(...oceanDark);
                        pdf.text('Blockers & Risks', margin + cardPadding, yPos + 10);
                        pdf.setFont('helvetica', 'normal');
                        pdf.setFontSize(9);
                        pdf.setTextColor(...grayText);
                        pdf.text('Issues needing attention', margin + cardPadding, yPos + 16);
                        yPos += 22;

                        // Auto-detected
                        if (reportData.autoBlockers && reportData.autoBlockers.length > 0) {
                            reportData.autoBlockers.forEach(b => {
                                pdf.setFontSize(9);
                                pdf.setTextColor(...amberColor);
                                pdf.text(`! ${b}`, margin + cardPadding, yPos);
                                yPos += 5;
                            });
                            yPos += 3;
                        }

                        // Narrative
                        if (reportData.narratives.blockersRisks) {
                            yPos += 2;
                            pdf.setFontSize(9);
                            pdf.setTextColor(...grayText);
                            const lines = pdf.splitTextToSize(reportData.narratives.blockersRisks, contentWidth - (cardPadding * 2));
                            lines.forEach(line => {
                                pdf.text(line, margin + cardPadding, yPos);
                                yPos += 4;
                            });
                        }
                        yPos += 10;
                    }

                    // Footer
                    pdf.setFontSize(7);
                    pdf.setTextColor(...grayText);
                    pdf.text(`Generated on ${new Date().toLocaleDateString('en-GB')}`, margin, pageHeight - 10);

                    // Save
                    const filename = `Status_Report_${reportData.managerName.replace(/\s+/g, '_')}_${new Date().toISOString().slice(0, 10)}.pdf`;
                    pdf.save(filename);

                } catch (error) {
                    Logger.error(error, 'Status report PDF export error');
                    alert(`PDF Export Error: ${error.message}`);
                } finally {
                    const overlay = document.getElementById('pdf-export-loading');
                    if (overlay) document.body.removeChild(overlay);
                }
            };

            // Derived State: Available Tags
            const availableTags = Array.from(new Set(entries.flatMap(e => e.tags || []))).sort();

            // Filter Logic
            const filterEntries = (items) => {
                return items.filter(entry => {
                    // Filter out archived items unless showArchived is true
                    const matchesArchived = showArchived || !entry.archived;

                    const matchesSearch = searchQuery === "" ||
                        entry.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                        entry.owner.toLowerCase().includes(searchQuery.toLowerCase()) ||
                        (entry.tags && entry.tags.some(t => t.toLowerCase().includes(searchQuery.toLowerCase())));

                    const matchesTags = filterTags.length === 0 || (entry.tags && entry.tags.some(t => filterTags.includes(t)));

                    const matchesUsers = filterUsers.length === 0 ||
                        filterUsers.some(u => entry.owner === u || (entry.collaborators && entry.collaborators.includes(u)));

                    const matchesTeams = filterTeams.length === 0 || filterTeams.includes(entry.team);

                    return matchesArchived && matchesSearch && matchesTags && matchesUsers && matchesTeams;
                });
            };

            const handleNavigate = (view) => {
                // Intercept add-item navigation to show modal
                if (view === 'add-item') {
                    setShowAddItemModal(true);
                    return;
                }

                // Clear filters on all major view changes to prevent unexpected filtering
                const shouldClearFilters = ['dashboard', 'personal', 'teams', 'org', 'calendar', 'manager-hub'].includes(view);
                if (shouldClearFilters) {
                    setSearchQuery("");
                    setFilterTags([]);
                    setFilterUsers([]);
                    setFilterTeams([]);
                }

                setCurrentView(view);
                if (view === 'dashboard') {
                    setSelectedTeam(null);
                    setSelectedItemId(null);
                    setViewMode('kanban');
                }
            };

            const handleTeamSelect = (team) => {
                setSelectedTeam(team);
                setCurrentView("team-board");
            };

            const handleAddItem = async (newItem) => {
                setSaving(true);
                setSaveError("");

                try {
                    // Use Supabase if enabled
                    if (SUPABASE_CONFIG.ENABLED && supabase) {
                        const saved = await SUPABASE_API.saveItem({
                            ...newItem,
                            workflowStatus: newItem.workflowStatus || "Idea"
                        }, userEmail); // Pass userEmail for ownership
                        if (saved) {
                            // Auto-create linked whiteboard for the project
                            await WHITEBOARD_API.createWhiteboard({
                                title: `${saved.title} - Whiteboard`,
                                description: `Whiteboard for project: ${saved.title}`,
                                owner_email: userEmail,
                                owner_name: currentUser,
                                workflow_item_id: saved.id,
                                canvas_width: 3000,
                                canvas_height: 2000
                            });

                            // Add to local state
                            setEntries(prev => [SUPABASE_API.mapToAppFormat(saved), ...prev]);
                            setCurrentView('dashboard');

                            // Log activity
                            logActivity('created', 'workflow_item', saved.id, newItem.title, {
                                status: newItem.workflowStatus || 'Idea',
                                team: newItem.team
                            }, newItem.collaborators || []);
                        }
                        setSaving(false);
                        return;
                    }

                    // Fall back to SharePoint
                    const { title, caption, workflowStatus, team, timelineValue, ...complexData } = newItem;
                    const payload = {
                        __metadata: { "type": "SP.Data.WorkflowItemsListItem" },
                        Title: title,
                        caption: caption,
                        workflowStatus: "Idea",
                        team: team,
                        timelineValue: timelineValue,
                        JSON_Data: JSON.stringify(complexData)
                    };

                    await SP_API.saveItem('WorkflowItems', payload);
                    window.location.reload();
                } catch (error) {
                    Logger.error(error, "Failed to save item");
                    setSaveError("Failed to save item. Please try again.");
                    setSaving(false);
                }
            };

            // Handle adding a new Job (simplified workflow item)
            const handleAddJob = async (jobData) => {
                if (!SUPABASE_CONFIG.ENABLED || !supabase) return;

                try {
                    const dbItem = {
                        title: jobData.title,
                        caption: jobData.description || '',
                        workflow_status: jobData.workflowStatus || 'todo',
                        team: jobData.team || '',
                        timeline_value: jobData.date || null,
                        owner: jobData.owner || currentUser,
                        owner_email: userEmail,
                        collaborators: [],
                        tags: jobData.priority ? [jobData.priority] : [],
                        subtasks: [],
                        documents: [],
                        date: jobData.date || null,
                        comments: [],
                        archived: false,
                        dependencies: [],
                        custom_fields: {},
                        attachments: [],
                        item_type: 'job'
                    };

                    const { data, error } = await supabase
                        .from('workflow_items')
                        .insert([dbItem])
                        .select()
                        .single();

                    if (error) {
                        Logger.error(error, 'Error creating job');
                        return;
                    }

                    // Auto-create linked whiteboard for the job
                    await WHITEBOARD_API.createWhiteboard({
                        title: `${data.title} - Whiteboard`,
                        description: `Whiteboard for job: ${data.title}`,
                        owner_email: userEmail,
                        owner_name: currentUser,
                        workflow_item_id: data.id,
                        canvas_width: 3000,
                        canvas_height: 2000
                    });

                    setEntries(prev => [SUPABASE_API.mapToAppFormat(data), ...prev]);
                    setCurrentView('jobs');
                } catch (error) {
                    Logger.error(error, 'Error creating job');
                }
            };

            const handleUpdateStatus = async (id, newStatus) => {
                // Check permission before allowing status update
                const entry = entries.find(e => e.id === id);
                if (!entry) return;

                if (!canEditItem(entry, userEmail, currentUser)) {
                    Logger.warn("Permission denied: Cannot update status of items you don't own");
                    setSaveError("You can only update your own items or items you collaborate on.");
                    setTimeout(() => setSaveError(""), 3000);
                    return;
                }

                const oldStatus = entry.workflowStatus;

                // 1. Optimistic Update (Instant UI change)
                setEntries(entries.map(e => e.id === id ? { ...e, workflowStatus: newStatus } : e));

                // 2. Persist to database
                if (SUPABASE_CONFIG.ENABLED && supabase) {
                    await SUPABASE_API.updateItem(id, { ...entry, workflowStatus: newStatus });
                } else {
                    await SP_API.updateItem('WorkflowItems', id, {
                        __metadata: { "type": "SP.Data.WorkflowItemsListItem" },
                        workflowStatus: newStatus
                    });
                }

                // 3. Log activity
                logActivity('status_changed', 'workflow_item', id, entry.title, {
                    from_status: oldStatus,
                    to_status: newStatus,
                    team: entry.team
                }, entry.collaborators || []);
            };

            // Bulk status change handler
            const handleBulkStatusChange = async (ids, newStatus) => {
                // Capture entries before state update to avoid stale references
                const entriesToUpdate = entries.filter(e => ids.includes(e.id));

                // Update all items optimistically
                setEntries(prev => prev.map(e =>
                    ids.includes(e.id) ? { ...e, workflowStatus: newStatus } : e
                ));

                // Persist each to database
                for (const entry of entriesToUpdate) {
                    const oldStatus = entry.workflowStatus;

                    if (SUPABASE_CONFIG.ENABLED && supabase) {
                        await SUPABASE_API.updateItem(entry.id, { workflowStatus: newStatus });
                    }

                    // Log activity with correct old status
                    logActivity('status_changed', 'workflow_item', entry.id, entry.title, {
                        from_status: oldStatus,
                        to_status: newStatus,
                        bulk_operation: true
                    }, entry.collaborators || []);
                }
            };

            // Bulk delete handler
            const handleBulkDelete = async (ids) => {
                // Capture entries before deletion for potential rollback
                const deletedEntries = entries.filter(e => ids.includes(e.id));

                // Remove from state optimistically
                setEntries(prev => prev.filter(e => !ids.includes(e.id)));

                const failedDeletes = [];

                // Delete from database with error handling
                for (const entry of deletedEntries) {
                    try {
                        if (SUPABASE_CONFIG.ENABLED && supabase) {
                            const result = await SUPABASE_API.deleteItem(entry.id);
                            if (!result) {
                                failedDeletes.push(entry);
                                continue;
                            }
                        }

                        // Log activity only on success
                        logActivity('deleted', 'workflow_item', entry.id, entry.title, {
                            team: entry.team
                        });
                    } catch (error) {
                        Logger.error(error, `Failed to delete item ${entry.id}`);
                        failedDeletes.push(entry);
                    }
                }

                // Rollback failed deletions by adding them back to state
                if (failedDeletes.length > 0) {
                    setEntries(prev => [...prev, ...failedDeletes]);
                    setSaveError(`Failed to delete ${failedDeletes.length} item(s). They have been restored.`);
                    setTimeout(() => setSaveError(""), 5000);
                }
            };

            const handleOpenEntry = (id) => {
                setSelectedItemId(id);
                setCurrentView("item-dashboard");
            };

            const handleToggleSubtask = (entryId, subtaskId) => {
                // Find entry and subtask for logging before the update
                const entry = entries.find(e => e.id === entryId);
                const subtask = entry?.subtasks?.find(st => st.id === subtaskId);
                const wasCompleted = subtask?.completed;

                handleUpdateEntry(entryId, (entry) => {
                    if (!entry.subtasks) return entry;
                    const subtasks = entry.subtasks.map((st) =>
                        st.id === subtaskId ? { ...st, completed: !st.completed } : st
                    );
                    return { ...entry, subtasks };
                });

                // Log activity
                if (entry && subtask) {
                    logActivity(wasCompleted ? 'subtask_uncompleted' : 'subtask_completed', 'workflow_item', entryId, entry.title, {
                        subtask_title: subtask.title,
                        subtask_assignee: subtask.assignedTo
                    }, [subtask.assignedTo]);
                }
            };

            const handleDeleteSubtask = (entryId, subtaskId) => {
                // Find entry and subtask for logging before the update
                const entry = entries.find(e => e.id === entryId);
                const subtask = entry?.subtasks?.find(st => st.id === subtaskId);

                handleUpdateEntry(entryId, (entry) => {
                    if (!entry.subtasks) return entry;
                    const subtasks = entry.subtasks.filter((st) => st.id !== subtaskId);
                    return { ...entry, subtasks };
                });

                // Log activity
                if (entry && subtask) {
                    logActivity('subtask_deleted', 'workflow_item', entryId, entry.title, {
                        subtask_title: subtask.title,
                        subtask_assignee: subtask.assignedTo
                    }, [subtask.assignedTo]);
                }
            };

            const handleEditSubtask = (entryId, subtaskId, updates) => {
                // Find entry and subtask for logging
                const entry = entries.find(e => e.id === entryId);
                const subtask = entry?.subtasks?.find(st => st.id === subtaskId);

                handleUpdateEntry(entryId, (entry) => {
                    if (!entry.subtasks) return entry;
                    const subtasks = entry.subtasks.map((st) =>
                        st.id === subtaskId ? { ...st, ...updates } : st
                    );
                    return { ...entry, subtasks };
                });

                // Log activity
                if (entry && subtask) {
                    logActivity('subtask_edited', 'workflow_item', entryId, entry.title, {
                        subtask_title: updates.title || subtask.title,
                        subtask_assignee: updates.assignedTo || subtask.assignedTo
                    }, [updates.assignedTo || subtask.assignedTo]);
                }
            };

            const handleAddTodo = useCallback(async (newTodo) => {
                const saved = await SUPABASE_API.savePersonalTodo(newTodo, userEmail);
                if (saved) {
                    setTodos(prev => [saved, ...prev]);
                } else {
                    // Fallback to local-only if save fails
                    setTodos(prev => [...prev, { ...newTodo, id: Date.now() }]);
                }
            }, [userEmail]);

            const handleToggleTodo = useCallback(async (todoId) => {
                // Use functional update to get current state
                let todoToToggle = null;
                setTodos(prev => {
                    todoToToggle = prev.find(t => t.id === todoId);
                    if (!todoToToggle) return prev;
                    return prev.map(t => t.id === todoId ? { ...t, completed: !t.completed } : t);
                });

                // Persist to database (async, after optimistic update)
                if (todoToToggle) {
                    const updated = await SUPABASE_API.updatePersonalTodo(todoId, { completed: !todoToToggle.completed });
                    if (!updated) {
                        // Revert on failure
                        setTodos(prev => prev.map(t => t.id === todoId ? { ...t, completed: todoToToggle.completed } : t));
                    }
                }
            }, []);

            const handleUpdateTodo = useCallback(async (todoId, updates) => {
                // Optimistically update UI using functional update
                setTodos(prev => prev.map(t => t.id === todoId ? { ...t, ...updates } : t));

                // Persist to database
                const updated = await SUPABASE_API.updatePersonalTodo(todoId, updates);
                if (!updated) {
                    // Note: Could revert here, but updates are less critical
                    Logger.warn('Failed to persist todo update');
                }
            }, []);

            const handleDeleteTodo = useCallback(async (todoId) => {
                let todoToDelete = null;
                // Optimistically update UI using functional update
                setTodos(prev => {
                    todoToDelete = prev.find(t => t.id === todoId);
                    return prev.filter(t => t.id !== todoId);
                });

                // Persist to database
                const success = await SUPABASE_API.deletePersonalTodo(todoId);
                if (!success && todoToDelete) {
                    // Revert on failure
                    setTodos(prev => [...prev, todoToDelete]);
                }
            }, []);

            // ============ WORKSTREAM HANDLERS ============

            const handleCreateWorkstream = async (workstream) => {
                const saved = await SUPABASE_API.saveWorkstream(workstream, userEmail);
                if (saved) {
                    setWorkstreams(prev => [saved, ...prev]);
                    return saved;
                }
                return null;
            };

            const handleUpdateWorkstream = async (id, updates) => {
                const updated = await SUPABASE_API.updateWorkstream(id, updates);
                if (updated) {
                    setWorkstreams(prev => prev.map(w => w.id === id ? updated : w));
                    return updated;
                }
                return null;
            };

            const handleDeleteWorkstream = async (id) => {
                const success = await SUPABASE_API.deleteWorkstream(id);
                if (success) {
                    setWorkstreams(prev => prev.filter(w => w.id !== id));
                    if (currentWorkstreamId === id) {
                        setCurrentWorkstreamId(null);
                    }
                }
                return success;
            };

            const handleLoadWorkstreamTasks = async (workstreamId) => {
                const tasks = await SUPABASE_API.fetchWorkstreamTasks(workstreamId);
                setWorkstreamTasks(prev => ({ ...prev, [workstreamId]: tasks }));
                return tasks;
            };

            const handleCreateWorkstreamTask = async (task) => {
                const saved = await SUPABASE_API.saveWorkstreamTask(task, userEmail);
                if (saved) {
                    setWorkstreamTasks(prev => ({
                        ...prev,
                        [task.workstreamId]: [...(prev[task.workstreamId] || []), saved]
                    }));
                    // Refresh my tasks for dashboard
                    const myTasks = await SUPABASE_API.fetchMyWorkstreamTasks(userEmail);
                    setMyWorkstreamTasks(myTasks);
                    return saved;
                }
                return null;
            };

            const handleUpdateWorkstreamTask = async (id, workstreamId, updates) => {
                const updated = await SUPABASE_API.updateWorkstreamTask(id, updates);
                if (updated) {
                    setWorkstreamTasks(prev => ({
                        ...prev,
                        [workstreamId]: (prev[workstreamId] || []).map(t => t.id === id ? updated : t)
                    }));
                    // Refresh my tasks for dashboard
                    const myTasks = await SUPABASE_API.fetchMyWorkstreamTasks(userEmail);
                    setMyWorkstreamTasks(myTasks);
                    return updated;
                }
                return null;
            };

            const handleDeleteWorkstreamTask = async (id, workstreamId) => {
                const success = await SUPABASE_API.deleteWorkstreamTask(id);
                if (success) {
                    setWorkstreamTasks(prev => ({
                        ...prev,
                        [workstreamId]: (prev[workstreamId] || []).filter(t => t.id !== id)
                    }));
                    // Refresh my tasks for dashboard
                    const myTasks = await SUPABASE_API.fetchMyWorkstreamTasks(userEmail);
                    setMyWorkstreamTasks(myTasks);
                }
                return success;
            };

            const handleReorderTasks = async (workstreamId, taskUpdates) => {
                // Optimistically update UI
                setWorkstreamTasks(prev => {
                    const tasks = prev[workstreamId] || [];
                    const updatedTasks = tasks.map(t => {
                        const update = taskUpdates.find(u => u.id === t.id);
                        return update ? { ...t, sort_order: update.sortOrder, priority: update.priority } : t;
                    });
                    return { ...prev, [workstreamId]: updatedTasks };
                });
                // Persist to database
                await SUPABASE_API.updateTaskSortOrders(taskUpdates);
            };

            const openStatsModal = (title, items) => {
                setStatsModalTitle(title);
                setStatsModalItems(items || []);
                setShowStatsModal(true);
            };

            const closeStatsModal = () => {
                setShowStatsModal(false);
                setStatsModalItems([]);
                setStatsModalTitle('');
            };

            // View Logic
            const renderContent = () => {
                switch (currentView) {
                    case 'dashboard':
                        return <Dashboard entries={entries} currentUser={currentUser} onOpenEntry={handleOpenEntry} onOpenPdfExport={handleOpenPdfExport} onNavigate={handleNavigate} todos={todos} onToggleTodo={handleToggleTodo} onAddTodo={handleAddTodo} onUpdateTodo={handleUpdateTodo} onDeleteTodo={handleDeleteTodo} onUpdateEntry={handleUpdateEntry} onEditSubtask={handleEditSubtask} workstreamTasks={myWorkstreamTasks} onOpenWorkstreamTask={(workstreamId, taskId) => { setCurrentWorkstreamId(workstreamId); setCurrentWorkstreamTaskId(taskId); setCurrentView('workstreams'); }} onUpdateWorkstreamTask={handleUpdateWorkstreamTask} Badge={Badge} />;

                    case "add-item":
                        return (
                            <AddItemForm
                                onSubmit={handleAddItem}
                                onBack={() => handleNavigate('dashboard')}
                                availableTags={availableTags}
                                TEAMS={TEAMS}
                                USERS={USERS}
                                TIMELINE_TYPES={TIMELINE_TYPES}
                                inputBaseClasses={inputBaseClasses}
                                selectBaseClasses={selectBaseClasses}
                            />
                        );

                    case 'whiteboards':
                        if (currentWhiteboardId) {
                            const wb = whiteboards.find(w => w.id === currentWhiteboardId);
                            return (
                                <WhiteboardCanvas
                                    whiteboardId={currentWhiteboardId}
                                    whiteboard={wb}
                                    onBack={() => setCurrentWhiteboardId(null)}
                                    userEmail={userEmail}
                                    currentUser={currentUser}
                                    WHITEBOARD_API={WHITEBOARD_API}

                                            <div className="flex items-center justify-between mb-3">
                                                <h3 className="font-heading text-lg text-ocean-900 tracking-wide flex items-center gap-2">

                                                    Status breakdown

                                                <Badge variant="secondary">{personalEntries.length}</Badge>
                                            </div>
                                            {personalEntries.length ? (
                                                <div className="space-y-2">
                                                    {Object.entries(statusCounts).sort((a, b) => b[1] - a[1]).map(([status, count]) => (
                                                        <div key={status}>
                                                            <div className="flex items-center justify-between text-xs text-graystone-600 mb-1">

                                            )}

                                                                    setPdfExportOptions(prev => ({
                                                                        ...prev,
                                                                        statusFilter: e.target.checked
                                                                            ? [...prev.statusFilter, status]
                                                                            : prev.statusFilter.filter(s => s !== status)
                                                                    }));
                                                                }}
                                                                className="rounded border-graystone-300 text-ocean-600 focus:ring-ocean-500"
                                                            />
                                                            <span className="text-sm text-ocean-900">{status}</span>
                                                        </label>
                                                    ))}
                                                </div>
                                                <p className="text-xs text-graystone-400 mt-1">Leave all unchecked to include all statuses</p>
                                            </div>

                                            {/* Team Member Filter */}
                                            <div>
                                                <h4 className="text-xs font-bold text-graystone-500 uppercase mb-3">Team Members {pdfExportOptions.memberFilter.length > 0 && `(${pdfExportOptions.memberFilter.length} selected)`}</h4>
                                                <div className="grid grid-cols-2 gap-1 max-h-32 overflow-y-auto">
                                                    {USERS.map(user => (
                                                        <label key={user} className="flex items-center gap-2 p-2 hover:bg-ocean-50 rounded cursor-pointer">
                                                            <input
                                                                type="checkbox"
                                                                checked={pdfExportOptions.memberFilter.includes(user)}
                                                                onChange={(e) => {
                                                                    setPdfExportOptions(prev => ({
                                                                        ...prev,
                                                                        memberFilter: e.target.checked
                                                                            ? [...prev.memberFilter, user]
                                                                            : prev.memberFilter.filter(u => u !== user)
                                                                    }));
                                                                }}
                                                                className="rounded border-graystone-300 text-ocean-600 focus:ring-ocean-500"
                                                            />
                                                            <span className="text-sm text-ocean-900 truncate">{user}</span>
                                                        </label>
                                                    ))}
                                                </div>
                                                <p className="text-xs text-graystone-400 mt-1">Leave all unchecked to include all members</p>
                                            </div>

                                            {/* Team Filter */}
                                            <div>
                                                <h4 className="text-xs font-bold text-graystone-500 uppercase mb-3">Teams {pdfExportOptions.teamFilter.length > 0 && `(${pdfExportOptions.teamFilter.length} selected)`}</h4>
                                                <div className="flex flex-wrap gap-2">
                                                    {TEAMS.map(team => (
                                                        <label key={team} className="flex items-center gap-2 p-2 hover:bg-ocean-50 rounded cursor-pointer border border-graystone-200">
                                                            <input
                                                                type="checkbox"
                                                                checked={pdfExportOptions.teamFilter.includes(team)}
                                                                onChange={(e) => {
                                                                    setPdfExportOptions(prev => ({
                                                                        ...prev,
                                                                        teamFilter: e.target.checked
                                                                            ? [...prev.teamFilter, team]
                                                                            : prev.teamFilter.filter(t => t !== team)
                                                                    }));
                                                                }}
                                                                className="rounded border-graystone-300 text-ocean-600 focus:ring-ocean-500"
                                                            />
                                                            <span className="text-sm text-ocean-900">{team}</span>
                                                        </label>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>
                                    )}

                                    {/* Layout Tab */}
                                    {pdfExportTab === 'layout' && (
                                        <div className="space-y-6">
                                            {/* Orientation */}
                                            <div>
                                                <h4 className="text-xs font-bold text-graystone-500 uppercase mb-3">Page Orientation</h4>
                                                <div className="flex gap-3">
                                                    <button
                                                        onClick={() => setPdfExportOptions(prev => ({ ...prev, orientation: 'portrait' }))}
                                                        className={cx(
                                                            "flex-1 p-4 rounded-xl border-2 transition flex flex-col items-center gap-2",
                                                            pdfExportOptions.orientation === 'portrait'
                                                                ? "border-ocean-500 bg-ocean-50"
                                                                : "border-graystone-200 hover:border-ocean-300"
                                                        )}
                                                    >
                                                        <div className="w-8 h-12 border-2 border-current rounded"></div>
                                                        <span className="text-sm font-medium">Portrait</span>
                                                    </button>
                                                    <button
                                                        onClick={() => setPdfExportOptions(prev => ({ ...prev, orientation: 'landscape' }))}
                                                        className={cx(
                                                            "flex-1 p-4 rounded-xl border-2 transition flex flex-col items-center gap-2",
                                                            pdfExportOptions.orientation === 'landscape'
                                                                ? "border-ocean-500 bg-ocean-50"
                                                                : "border-graystone-200 hover:border-ocean-300"
                                                        )}
                                                    >
                                                        <div className="w-12 h-8 border-2 border-current rounded"></div>
                                                        <span className="text-sm font-medium">Landscape</span>
                                                    </button>
                                                </div>
                                            </div>

                                            {/* View Mode */}
                                            <div>
                                                <h4 className="text-xs font-bold text-graystone-500 uppercase mb-3">View Mode</h4>
                                                <div className="flex gap-3">
                                                    <button
                                                        onClick={() => setPdfExportOptions(prev => ({ ...prev, viewMode: 'compact' }))}
                                                        className={cx(
                                                            "flex-1 p-4 rounded-xl border-2 transition",
                                                            pdfExportOptions.viewMode === 'compact'
                                                                ? "border-ocean-500 bg-ocean-50"
                                                                : "border-graystone-200 hover:border-ocean-300"
                                                        )}
                                                    >
                                                        <div className="flex flex-col gap-1 mb-2">
                                                            <div className="h-1 bg-current rounded w-full opacity-60"></div>
                                                            <div className="h-1 bg-current rounded w-3/4 opacity-40"></div>
                                                            <div className="h-1 bg-current rounded w-full opacity-60"></div>
                                                            <div className="h-1 bg-current rounded w-2/3 opacity-40"></div>
                                                        </div>
                                                        <span className="text-sm font-medium">Compact</span>
                                                        <p className="text-xs text-graystone-500 mt-1">Summary view with key info</p>
                                                    </button>
                                                    <button
                                                        onClick={() => setPdfExportOptions(prev => ({ ...prev, viewMode: 'detailed' }))}
                                                        className={cx(
                                                            "flex-1 p-4 rounded-xl border-2 transition",
                                                            pdfExportOptions.viewMode === 'detailed'
                                                                ? "border-ocean-500 bg-ocean-50"
                                                                : "border-graystone-200 hover:border-ocean-300"
                                                        )}
                                                    >
                                                        <div className="flex flex-col gap-1 mb-2">
                                                            <div className="h-2 bg-current rounded w-full opacity-60"></div>
                                                            <div className="h-1 bg-current rounded w-full opacity-30"></div>
                                                            <div className="h-1 bg-current rounded w-full opacity-30"></div>
                                                            <div className="h-2 bg-current rounded w-full opacity-60"></div>
                                                            <div className="h-1 bg-current rounded w-full opacity-30"></div>
                                                        </div>
                                                        <span className="text-sm font-medium">Detailed</span>
                                                        <p className="text-xs text-graystone-500 mt-1">Full details and descriptions</p>
                                                    </button>
                                                </div>
                                            </div>

                                            {/* Layout Style */}
                                            <div>
                                                <h4 className="text-xs font-bold text-graystone-500 uppercase mb-3">Layout Style</h4>
                                                <div className="flex gap-3">
                                                    <button
                                                        onClick={() => setPdfExportOptions(prev => ({ ...prev, layoutStyle: 'cards' }))}
                                                        className={cx(
                                                            "flex-1 p-4 rounded-xl border-2 transition",
                                                            pdfExportOptions.layoutStyle === 'cards'
                                                                ? "border-ocean-500 bg-ocean-50"
                                                                : "border-graystone-200 hover:border-ocean-300"
                                                        )}
                                                    >
                                                        <div className="flex gap-1 mb-2">
                                                            <div className="w-1/2 h-8 bg-current rounded opacity-40 border border-current"></div>
                                                            <div className="w-1/2 h-8 bg-current rounded opacity-40 border border-current"></div>
                                                        </div>
                                                        <span className="text-sm font-medium">Cards</span>
                                                        <p className="text-xs text-graystone-500 mt-1">Task cards in grid</p>
                                                    </button>
                                                    <button
                                                        onClick={() => setPdfExportOptions(prev => ({ ...prev, layoutStyle: 'table' }))}
                                                        className={cx(
                                                            "flex-1 p-4 rounded-xl border-2 transition",
                                                            pdfExportOptions.layoutStyle === 'table'
                                                                ? "border-ocean-500 bg-ocean-50"
                                                                : "border-graystone-200 hover:border-ocean-300"
                                                        )}
                                                    >
                                                        <div className="flex flex-col gap-1 mb-2">
                                                            <div className="h-2 bg-current rounded w-full opacity-60"></div>
                                                            <div className="h-1.5 bg-current rounded w-full opacity-30"></div>
                                                            <div className="h-1.5 bg-current rounded w-full opacity-20"></div>
                                                            <div className="h-1.5 bg-current rounded w-full opacity-30"></div>
                                                        </div>
                                                        <span className="text-sm font-medium">Table</span>
                                                        <p className="text-xs text-graystone-500 mt-1">Structured rows</p>
                                                    </button>
                                                    <button
                                                        onClick={() => setPdfExportOptions(prev => ({ ...prev, layoutStyle: 'list' }))}
                                                        className={cx(
                                                            "flex-1 p-4 rounded-xl border-2 transition",
                                                            pdfExportOptions.layoutStyle === 'list'
                                                                ? "border-ocean-500 bg-ocean-50"
                                                                : "border-graystone-200 hover:border-ocean-300"
                                                        )}
                                                    >
                                                        <div className="flex flex-col gap-1 mb-2">
                                                            <div className="h-2 bg-current rounded w-full opacity-50"></div>
                                                            <div className="h-px bg-current w-full opacity-30"></div>
                                                            <div className="h-2 bg-current rounded w-full opacity-50"></div>
                                                            <div className="h-px bg-current w-full opacity-30"></div>
                                                        </div>
                                                        <span className="text-sm font-medium">List</span>
                                                        <p className="text-xs text-graystone-500 mt-1">Simple list view</p>
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                </div>

                                {/* Footer Actions */}
                                <div className="border-t border-graystone-200 p-4 flex justify-between items-center bg-graystone-50">
                                    <button
                                        onClick={() => {
                                            setPdfExportOptions({
                                                includeTaskDetails: true,
                                                includeSubtasks: true,
                                                includeComments: false,
                                                includeTeamStats: true,
                                                dateRange: { preset: 'all', start: null, end: null },
                                                statusFilter: [],
                                                memberFilter: [],
                                                teamFilter: [],
                                                orientation: 'landscape',
                                                viewMode: 'detailed',
                                                layoutStyle: 'cards'
                                            });
                                        }}
                                        className="text-sm text-graystone-500 hover:text-graystone-700 transition-colors"
                                    >
                                        Reset to defaults
                                    </button>
                                    <div className="flex gap-3">
                                        <button
                                            onClick={() => setShowPdfExportModal(false)}
                                            className="px-4 py-2 text-sm font-medium text-graystone-600 hover:text-graystone-800 transition-colors"
                                        >
                                            Cancel
                                        </button>
                                        <button
                                            onClick={() => handleCustomPdfExport()}
                                            className="px-6 py-2 bg-ocean-600 text-white text-sm font-medium rounded-lg hover:bg-ocean-700 transition-colors shadow-sm flex items-center gap-2"
                                        >
                                            <i data-lucide="download" className="w-4 h-4"></i>
                                            Export PDF
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Saving Overlay */}
                    {saving && (
                        <div
                            className="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 z-[100]"
                            role="status"
                            aria-live="assertive"
                        >
                            <div className="bg-white rounded-2xl p-8 shadow-xl text-center">
                                <LoadingSpinner size="lg" text="Saving..." />
                                <div className="text-sm text-graystone-500 mt-1">Please wait</div>
                            </div>
                        </div>
                    )}

                    {/* Error Toast */}
                    {saveError && (
                        <div
                            className="fixed bottom-6 right-6 z-[100] animate-in slide-in-from-bottom-4 duration-300"
                            role="alert"
                            aria-live="assertive"
                        >
                            <div className="bg-red-50 border border-red-200 text-red-700 px-6 py-4 rounded-xl shadow-lg flex items-center gap-3">
                                <i data-lucide="alert-circle" className="w-5 h-5" aria-hidden="true"></i>
                                <span>{saveError}</span>
                                <button
                                    onClick={() => setSaveError("")}
                                    className="ml-2 text-red-500 hover:text-red-700"
                                    aria-label="Dismiss error"
                                >
                                    <i data-lucide="x" className="w-4 h-4" aria-hidden="true"></i>
                                </button>
                            </div>
                        </div>
                    )}
                </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(
            <ErrorBoundary>
                <App />
            </ErrorBoundary>
        );

        // Initialize Lucide icons after initial render
        setTimeout(() => lucide.createIcons(), 0);
    </script>
</body>

</html>
