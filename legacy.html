        const Logger = {

            },
            warn: (...args) => {
                if (APP_CONFIG.DEBUG_MODE) console.warn('[WARN]', ...args);
            },
            error: (error, context = '') => {
                if (APP_CONFIG.DEBUG_MODE) {
                    console.error('[ERROR]', context, error);
                }
                // Future: send to error monitoring service (Sentry, etc.)
            }
        };

        // ============================================================
        // VALIDATION UTILITIES
        // ============================================================
        const Validators = {
            isValidEmail: (email) => {
                if (!email || typeof email !== 'string') return false;
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                return emailRegex.test(email.trim());
            },
            isOrgEmail: (email) => {
                if (!Validators.isValidEmail(email)) return false;
                return email.toLowerCase().endsWith(`@${APP_CONFIG.ORG_DOMAIN}`);
            }
        };

        // ============================================================
        // GLOBAL ERROR HANDLERS
        // ============================================================
        window.onerror = (message, source, lineno, colno, error) => {
            Logger.error(error, `Uncaught: ${source}:${lineno}`);
            return false;
        };

        window.addEventListener('unhandledrejection', (event) => {
            Logger.error(event.reason, 'Unhandled Promise Rejection');
        });

        // Initialize Supabase client
        let supabase = null;
        let supabaseLib = null;

        // Initialize Supabase SDK (without auth token)
        const initSupabaseSDK = async () => {
            if (supabaseLib) return supabaseLib;
            if (!SUPABASE_CONFIG.ENABLED || SUPABASE_CONFIG.SUPABASE_URL === "YOUR_SUPABASE_URL") {
                return null;
            }

            // Wait for the SDK to load via our dynamic loader
            supabaseLib = await window.supabaseReady;
            Logger.debug("Supabase SDK ready:", typeof supabaseLib?.createClient);
            return supabaseLib;
        };

        // Initialize Supabase client (Supabase Auth handles session automatically)
        const initSupabase = async () => {
            if (!SUPABASE_CONFIG.ENABLED || SUPABASE_CONFIG.SUPABASE_URL === "YOUR_SUPABASE_URL") {
                return false;
            }

            const lib = await initSupabaseSDK();
            if (!lib || typeof lib.createClient !== 'function') {
                return false;
            }

            try {
                supabase = lib.createClient(
                    SUPABASE_CONFIG.SUPABASE_URL,
                    SUPABASE_CONFIG.SUPABASE_ANON_KEY
                );
                Logger.debug("Supabase initialized");
                return true;
            } catch (e) {
                Logger.error(e, "Supabase createClient error");
                return false;
            }
        };

        // Try to init SDK on load (client will be created later with auth)
        document.addEventListener('DOMContentLoaded', initSupabaseSDK);
        window.addEventListener('load', initSupabaseSDK);
        setTimeout(initSupabaseSDK, 0);

        // ============================================
        // USER PROFILES (loaded from Supabase)
        // ============================================
        // Seed profiles provide initial user data. When users sign in, their profiles
        // are claimed in Supabase. This ensures the app works even before DB is populated.
        const SEED_PROFILES = [
            { email: "jameen.kaur@populationmatters.org", name: "Jameen Kaur", team: "Advocacy & Influence", role: "admin" },
            { email: "daniel.davis@populationmatters.org", name: "Dan Davis", team: "Advocacy & Influence", role: "manager" },
            { email: "emma.lewendon-strutt@populationmatters.org", name: "Emma Lewendon-Strutt", team: "Research", role: "member" },
            { email: "josh.hill@populationmatters.org", name: "Josh Hill", team: "Research", role: "member" },
            { email: "francesca.harrison@populationmatters.org", name: "Francesca Harrison", team: "Advocacy & Influence", role: "member" },
            { email: "madeleine.hewitt@populationmatters.org", name: "Madeleine Hewitt", team: "Advocacy & Influence", role: "member" },
            { email: "shweta.shirodkar@populationmatters.org", name: "Shweta Shirodkar", team: "Advocacy & Influence", role: "member" }
        ];

        // Global cache for user profiles loaded from Supabase
        // This gets populated at app startup and updated when roles change
        // Initialize with seed profiles so data is available immediately
        let userProfilesCache = [...SEED_PROFILES];

        // Legacy USERS_CONFIG for backwards compatibility (empty - data from Supabase)
        const USERS_CONFIG = {
            admins: [],
            managers: [],
            profiles: []
        };

        // Load user profiles cache from Supabase
        const loadUserProfilesCache = async () => {
            if (!supabase) {
                Logger.debug("Supabase not available, using seed profiles");
                userProfilesCache = [...SEED_PROFILES];
                return;
            }
            try {
                const profiles = await SUPABASE_API.fetchUserProfiles();
                if (profiles.length > 0) {
                    userProfilesCache = profiles;
                    Logger.debug(`Loaded ${profiles.length} user profiles from Supabase`);
                } else {
                    // No profiles in DB yet, use seed data
                    userProfilesCache = [...SEED_PROFILES];
                }
            } catch (e) {
                Logger.error(e, "Failed to load profiles cache");
                userProfilesCache = [...SEED_PROFILES];
            }
        };

        // Helper functions for role checking - checks Supabase cache first, falls back to seed data
        const isAdmin = (email) => {
            if (!email) return false;
            const normalized = email.toLowerCase();
            // Check Supabase cache first
            const cachedProfile = userProfilesCache.find(p => p.email.toLowerCase() === normalized);
            if (cachedProfile) {
                return cachedProfile.role === 'admin';
            }
            // Fallback to seed data
            const seedProfile = SEED_PROFILES.find(p => p.email.toLowerCase() === normalized);
            return seedProfile?.role === 'admin';
        };

        const isManager = (email) => {
            if (!email) return false;
            const normalized = email.toLowerCase();
            // Check Supabase cache first
            const cachedProfile = userProfilesCache.find(p => p.email.toLowerCase() === normalized);
            if (cachedProfile) {
                return cachedProfile.role === 'manager' || cachedProfile.role === 'admin';
            }
            // Fallback to seed data
            const seedProfile = SEED_PROFILES.find(p => p.email.toLowerCase() === normalized);
            return seedProfile?.role === 'manager' || seedProfile?.role === 'admin';
        };

        const getPreseededProfile = (email) => {
            if (!email) return null;
            const normalized = email.toLowerCase();
            // Check cache first, then seed data
            return userProfilesCache.find(p => p.email.toLowerCase() === normalized) ||
                   SEED_PROFILES.find(p => p.email.toLowerCase() === normalized);
        };

        // Get user's role from cache or seed data
        const getUserRole = (email) => {
            if (!email) return 'member';
            const normalized = email.toLowerCase();
            const cachedProfile = userProfilesCache.find(p => p.email.toLowerCase() === normalized);
            if (cachedProfile) return cachedProfile.role || 'member';
            const seedProfile = SEED_PROFILES.find(p => p.email.toLowerCase() === normalized);
            return seedProfile?.role || 'member';
        };

        // Check if user can edit an item (owner or collaborator)
        const canEditItem = (item, userEmail, userName) => {
            if (!item || !userEmail) return false;
            // Owner by email (most secure)
            if (item.ownerEmail && item.ownerEmail.toLowerCase() === userEmail.toLowerCase()) return true;
            // Fallback: owner by name (for legacy items without ownerEmail)
            if (item.owner === userName) return true;
            // Collaborators can also edit
            if (item.collaborators && item.collaborators.includes(userName)) return true;
            return false;
        };

        // Functions to modify roles - now updates Supabase
        const updateUserRole = async (email, newRole) => {
            const normalized = email.toLowerCase().trim();

            // Get old role for logging
            const oldRole = getUserRole(normalized);
            const profile = userProfilesCache.find(p => p.email.toLowerCase() === normalized);

            // Update in Supabase
            if (supabase) {
                const { error } = await supabase
                    .from('user_profiles')
                    .update({ role: newRole, updated_at: new Date().toISOString() })
                    .eq('email', normalized);

                if (error) {
                    Logger.error(error, 'Failed to update role in Supabase');
                    return false;
                }
            }

            // Update local cache
            const cacheIndex = userProfilesCache.findIndex(p => p.email.toLowerCase() === normalized);
            if (cacheIndex >= 0) {
                userProfilesCache[cacheIndex].role = newRole;
            }

            // Update legacy config for backwards compatibility
            if (newRole === 'admin') {
                if (!USERS_CONFIG.admins.includes(normalized)) USERS_CONFIG.admins.push(normalized);

        const exportToPDF = async (elementId, filename, title) => {
            const { jsPDF } = window.jspdf;
            const element = document.getElementById(elementId);

            if (!element) {
                Logger.error(elementId, 'Export element not found');
                return false;
            }

            try {
                // Show loading state
                const loadingOverlay = document.createElement('div');
                loadingOverlay.id = 'pdf-export-loading';
                loadingOverlay.innerHTML = `
                    <div style="position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:9999">
                        <div style="background:white;padding:24px 48px;border-radius:12px;text-align:center">
                            <div style="font-size:18px;font-weight:600;color:#0c4a6e;margin-bottom:8px">Generating PDF...</div>
                            <div style="font-size:14px;color:#64748b">Please wait</div>
                        </div>
                    </div>
                `;
                document.body.appendChild(loadingOverlay);

                // Capture the element
                const canvas = await html2canvas(element, {
                    scale: 2,
                    useCORS: true,
                    logging: false,
                    backgroundColor: '#f8fafc'
                });

                const imgData = canvas.toDataURL('image/png');
                const imgWidth = canvas.width;
                const imgHeight = canvas.height;

                // Calculate PDF dimensions (A4 landscape for wider content)
                const pdfWidth = 297; // A4 landscape width in mm
                const pdfHeight = 210; // A4 landscape height in mm
                const margin = 10;
                const contentWidth = pdfWidth - (margin * 2);

                // Scale image to fit width
                const ratio = contentWidth / (imgWidth / 2); // Divide by scale factor
                const scaledHeight = (imgHeight / 2) * ratio;

                // Create PDF
                const pdf = new jsPDF({
                    orientation: scaledHeight > pdfHeight ? 'portrait' : 'landscape',
                    unit: 'mm',
                    format: 'a4'
                });

                // Add title
                pdf.setFontSize(16);
                pdf.setTextColor(12, 74, 110); // ocean-900
                pdf.text(title || 'Export', margin, 15);

                // Add date
                pdf.setFontSize(10);
                pdf.setTextColor(100, 116, 139); // graystone-500
                pdf.text(`Generated: ${new Date().toLocaleDateString('en-GB', {
                    day: 'numeric',
                    month: 'long',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                })}`, margin, 22);

                // Calculate how many pages we need
                const pageContentHeight = (pdf.internal.pageSize.getHeight() - 30); // Leave space for header
                const totalPages = Math.ceil(scaledHeight / pageContentHeight);

                // Add image (may span multiple pages)
                if (totalPages === 1) {
                    pdf.addImage(imgData, 'PNG', margin, 28, contentWidth, scaledHeight);
                } else {
                    // Multi-page export
                    let yOffset = 0;
                    for (let page = 0; page < totalPages; page++) {
                        if (page > 0) {
                            pdf.addPage();
                        }

                        const sourceY = (page * pageContentHeight / ratio) * 2; // Convert back to canvas coords
                        const sourceHeight = Math.min((pageContentHeight / ratio) * 2, imgHeight - sourceY);

                        // Create a temporary canvas for this page section
                        const pageCanvas = document.createElement('canvas');
                        pageCanvas.width = imgWidth;
                        pageCanvas.height = sourceHeight;
                        const ctx = pageCanvas.getContext('2d');
                        ctx.drawImage(canvas, 0, sourceY, imgWidth, sourceHeight, 0, 0, imgWidth, sourceHeight);

                        const pageImgData = pageCanvas.toDataURL('image/png');
                        const pageScaledHeight = (sourceHeight / 2) * ratio;

                        pdf.addImage(pageImgData, 'PNG', margin, page === 0 ? 28 : 10, contentWidth, pageScaledHeight);
                    }
                }

                // Save the PDF
                pdf.save(`${filename || 'export'}_${new Date().toISOString().slice(0,10)}.pdf`);

                // Remove loading overlay
                document.body.removeChild(loadingOverlay);
                return true;

            } catch (error) {
                Logger.error(error, 'PDF export error');
                const overlay = document.getElementById('pdf-export-loading');
                if (overlay) document.body.removeChild(overlay);
                return false;
            }
        };

            if (!SUPABASE_CONFIG.ENABLED || !supabase) return;

            const actorName = window.__currentUserName || 'Someone';

            // Don't send email to self
            if (recipientEmail === window.__currentUserEmail) return;

            try {
                // Get the user's session token for authentication
                const { data: { session } } = await supabase.auth.getSession();
                if (!session?.access_token) {
                    Logger.warn('No session token available for email notification');
                    return;
                }

                await fetch(
                    `${SUPABASE_CONFIG.SUPABASE_URL}/functions/v1/send-notification-email`,
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${session.access_token}`, // Use user's JWT, not anon key
                        },
                        body: JSON.stringify({
                            recipientEmail,
                            recipientName,
                            notificationType,
                            itemTitle,
                            itemId: String(itemId),
                            actorName,
                            details
                        }),
                    }
                );

            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();

                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);

                oscillator.frequency.value = 800;
                oscillator.type = 'sine';
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);

                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.5);
            } catch (err) {
                Logger.debug('Audio not supported');

                if (notification.target_type === 'workflow_item' && notification.target_id) {

            // --- STATE REPLACEMENT END ---

            const [currentView, setCurrentView] = useState("dashboard"); // dashboard, personal, add-item, teams, team-board, org, calendar, item-dashboard, todo, manager-hub, workstreams
            const [selectedTeam, setSelectedTeam] = useState(null);
            const [selectedItemId, setSelectedItemId] = useState(null);
            const [todos, setTodos] = useState([]);

            // Workstreams state
            const [workstreams, setWorkstreams] = useState([]);
            const [workstreamTasks, setWorkstreamTasks] = useState({}); // { workstreamId: [tasks] }
            const [currentWorkstreamId, setCurrentWorkstreamId] = useState(null);
            const [currentWorkstreamTaskId, setCurrentWorkstreamTaskId] = useState(null);
            const [myWorkstreamTasks, setMyWorkstreamTasks] = useState([]);

            // Search & Filter State
            const [searchQuery, setSearchQuery] = useState("");
            const [filterTags, setFilterTags] = useState([]);
            const [filterUsers, setFilterUsers] = useState([]);
            const [filterTeams, setFilterTeams] = useState([]);
            const [showArchived, setShowArchived] = useState(false);
            const [viewMode, setViewMode] = useState('kanban'); // 'kanban', 'table', 'list', 'gantt', 'mindmap'

            // Saved Filters State
            const [savedFilters, setSavedFilters] = useState(() => {
                try {
                    const saved = localStorage.getItem('savedFilters');
                    return saved ? JSON.parse(saved) : [];
                } catch {
                    return [];
                }
            });
            const [showSavedFiltersMenu, setShowSavedFiltersMenu] = useState(false);

            // Persist saved filters to localStorage
            useEffect(() => {
                localStorage.setItem('savedFilters', JSON.stringify(savedFilters));
            }, [savedFilters]);

            // Save current filter as new saved filter
            const saveCurrentFilter = (name) => {
                if (!name.trim()) return;
                const newFilter = {
                    id: Date.now(),
                    name: name.trim(),
                    searchQuery,
                    filterTags: [...filterTags],
                    filterUsers: [...filterUsers],
                    filterTeams: [...filterTeams],
                    showArchived
                };
                setSavedFilters(prev => [...prev, newFilter]);
            };

            // Apply a saved filter
            const applySavedFilter = (filter) => {
                setSearchQuery(filter.searchQuery || '');
                setFilterTags(filter.filterTags || []);
                setFilterUsers(filter.filterUsers || []);
                setFilterTeams(filter.filterTeams || []);
                setShowArchived(filter.showArchived || false);
                setShowSavedFiltersMenu(false);
            };

            // Delete a saved filter
            const deleteSavedFilter = (filterId) => {
                setSavedFilters(prev => prev.filter(f => f.id !== filterId));
            };

            // Check if any filters are active
            const hasActiveFilters = searchQuery || filterTags.length > 0 || filterUsers.length > 0 || filterTeams.length > 0 || showArchived;

            // Subtask Modal State
            const [showSubtaskModal, setShowSubtaskModal] = useState(false);
            const [modalEntryId, setModalEntryId] = useState(null);
            const [newSubtaskTitle, setNewSubtaskTitle] = useState('');
            const [newSubtaskDeadline, setNewSubtaskDeadline] = useState('');
            const [newSubtaskOwner, setNewSubtaskOwner] = useState('');
            const [newSubtaskContext, setNewSubtaskContext] = useState('');

            // Add Item Choice Modal State
            const [showAddItemModal, setShowAddItemModal] = useState(false);

            // Quick Add Modal State (Ctrl/Cmd+K)
            const [showQuickAdd, setShowQuickAdd] = useState(false);

            // Global Search Modal State (Ctrl/Cmd+Shift+F)
            const [showGlobalSearch, setShowGlobalSearch] = useState(false);

            // Stats Modal (Personal view)
            const [showStatsModal, setShowStatsModal] = useState(false);
            const [statsModalTitle, setStatsModalTitle] = useState('');
            const [statsModalItems, setStatsModalItems] = useState([]);

            // Whiteboard State
            const [whiteboards, setWhiteboards] = useState([]);
            const [currentWhiteboardId, setCurrentWhiteboardId] = useState(null);

            // Productivity Tools State
            const [habits, setHabits] = useState([]);
            const [matrixTasks, setMatrixTasks] = useState([]);

            // Persist an entry back to the database (Supabase or SharePoint)
            const persistEntry = async (entry) => {
                try {
                    // Use Supabase if enabled
                    if (SUPABASE_CONFIG.ENABLED && supabase) {
                        await SUPABASE_API.updateItem(entry.id, entry);
                        return;
                    }

                    // Fall back to SharePoint
                    const {
                        id,
                        title,
                        caption,
                        workflowStatus,
                        team,
                        timelineValue,
                        owner,
                        collaborators,
                        ...extra
                    } = entry;
                    const payload = {
                        __metadata: { "type": "SP.Data.WorkflowItemsListItem" },
                        Title: title,
                        caption: caption,
                        workflowStatus: workflowStatus,
                        team: team,
                        timelineValue: timelineValue,
                        JSON_Data: JSON.stringify({
                            owner,
                            collaborators,
                            ...extra
                        })
                    };
                    await SP_API.updateItem('WorkflowItems', id, payload);
                } catch (e) {
                    Logger.error(e, "Failed to persist entry");
                }
            };

            // Re-initialize Lucide icons whenever content changes
            useEffect(() => {
                // Small delay to ensure DOM is fully rendered
                const timer = setTimeout(() => {
                    if (typeof lucide !== 'undefined') {
                        lucide.createIcons();
                    }
                }, 50);
                return () => clearTimeout(timer);
            }, [currentView, viewMode, showSubtaskModal, showAddItemModal, showStatsModal, showNotificationsPanel, showGlobalSearch, notifications, entries, loading, authChecked, authUser, darkMode]);

            const openSubtaskModal = (entryId) => {
                setModalEntryId(entryId);
                setShowSubtaskModal(true);
            };

            const closeSubtaskModal = () => {
                setShowSubtaskModal(false);
                setModalEntryId(null);
                setNewSubtaskTitle('');
                setNewSubtaskDeadline('');
                setNewSubtaskOwner('');
                setNewSubtaskContext('');
            };

            const handleUpdateEntry = (entryId, updates) => {
                // Check permission before allowing any updates
                const existingEntry = entries.find(e => e.id === entryId);
                if (existingEntry && !canEditItem(existingEntry, userEmail, currentUser)) {
                    Logger.warn("Permission denied: Cannot update items you don't own");
                    setSaveError("You can only edit your own items or items you collaborate on.");
                    setTimeout(() => setSaveError(""), 3000);
                    return;
                }

                let updatedEntry = null;
                const oldCommentsCount = existingEntry?.comments?.length || 0;

                setEntries((prev) =>
                    prev.map((entry) => {
                        if (entry.id !== entryId) return entry;
                        const patch = typeof updates === 'function' ? updates(entry) : updates;
                        if (!patch || typeof patch !== 'object') return entry;
                        updatedEntry = { ...entry, ...patch };
                        return updatedEntry;
                    })
                );
                if (updatedEntry) {
                    persistEntry(updatedEntry);

                    // Detect if a comment was added
                    const newCommentsCount = updatedEntry.comments?.length || 0;
                    if (newCommentsCount > oldCommentsCount) {
                        const newComment = updatedEntry.comments[newCommentsCount - 1];
                        logActivity('comment_added', 'workflow_item', entryId, existingEntry.title, {
                            comment_text: newComment.text?.substring(0, 100),
                            comment_author: newComment.author
                        }, existingEntry.collaborators || []);

                        // Send email notifications to collaborators and owner
                        const recipients = [...(existingEntry.collaborators || [])];
                        if (existingEntry.owner && !recipients.includes(existingEntry.owner)) {
                            recipients.push(existingEntry.owner);
                        }

                        recipients.forEach(recipient => {
                            const profile = userProfilesCache.find(p =>
                                p.name === recipient || p.email === recipient
                            );
                            if (profile && profile.email) {
                                sendNotificationEmail(
                                    profile.email,
                                    profile.name,
                                    'comment',
                                    existingEntry.title,
                                    entryId,
                                    { comment: newComment.text?.substring(0, 200) }
                                );
                            }
                        });
                    }

                    // Detect description change
                    if (updatedEntry.caption !== existingEntry.caption) {
                        logActivity('description_updated', 'workflow_item', entryId, existingEntry.title, {
                            old_length: existingEntry.caption?.length || 0,
                            new_length: updatedEntry.caption?.length || 0
                        }, existingEntry.collaborators || []);
                    }

                    // Detect status change from dropdown in ItemDashboard
                    if (updatedEntry.workflowStatus !== existingEntry.workflowStatus) {
                        logActivity('status_changed', 'workflow_item', entryId, existingEntry.title, {
                            from_status: existingEntry.workflowStatus,
                            to_status: updatedEntry.workflowStatus,
                            team: existingEntry.team
                        }, existingEntry.collaborators || []);
                    }

                    // Detect owner change and send notification
                    if (updatedEntry.owner && updatedEntry.owner !== existingEntry.owner) {
                        logActivity('owner_assigned', 'workflow_item', entryId, existingEntry.title, {
                            new_owner: updatedEntry.owner,
                            old_owner: existingEntry.owner
                        }, existingEntry.collaborators || []);

                        // Send email notification to new owner
                        const ownerProfile = userProfilesCache.find(p =>
                            p.name === updatedEntry.owner || p.email === updatedEntry.owner
                        );
                        if (ownerProfile && ownerProfile.email && ownerProfile.email !== userEmail) {
                            sendNotificationEmail(
                                ownerProfile.email,
                                ownerProfile.name,
                                'assignment',
                                existingEntry.title,
                                entryId,
                                {}
                            );
                        }
                    }

                    // Detect new collaborators and send notifications
                    const oldCollaborators = existingEntry.collaborators || [];
                    const newCollaborators = updatedEntry.collaborators || [];
                    const addedCollaborators = newCollaborators.filter(c => !oldCollaborators.includes(c));

                    if (addedCollaborators.length > 0) {
                        logActivity('collaborators_added', 'workflow_item', entryId, existingEntry.title, {
                            added_collaborators: addedCollaborators.join(', ')
                        }, newCollaborators);

                        // Send email notifications to new collaborators
                        addedCollaborators.forEach(collaborator => {
                            const profile = userProfilesCache.find(p =>
                                p.name === collaborator || p.email === collaborator
                            );
                            if (profile && profile.email && profile.email !== userEmail) {
                                sendNotificationEmail(
                                    profile.email,
                                    profile.name,
                                    'collaborator_added',
                                    existingEntry.title,
                                    entryId,
                                    {}
                                );
                            }
                        });
                    }
                }
            };

            const handleAddSubtask = (entryId) => {
                if (!newSubtaskTitle.trim()) return;

                // Validate owner - don't allow "Loading..." as assignee
                const assignee = newSubtaskOwner || (currentUser !== "Loading..." ? currentUser : USERS[0]);

                const newSubtask = {
                    id: `st${Date.now()}`,
                    title: newSubtaskTitle,
                    deadline: newSubtaskDeadline,
                    assignedTo: assignee,
                    completed: false,
                    context: newSubtaskContext
                };

                // Find entry for logging
                const entry = entries.find(e => e.id === entryId);

                handleUpdateEntry(entryId, (entry) => {
                    const updatedSubtasks = entry.subtasks ? [...entry.subtasks, newSubtask] : [newSubtask];
                    return { ...entry, subtasks: updatedSubtasks };
                });

                // Log activity
                if (entry) {
                    logActivity('subtask_added', 'workflow_item', entryId, entry.title, {
                        subtask_title: newSubtaskTitle,
                        subtask_assignee: assignee,
                        subtask_deadline: newSubtaskDeadline
                    }, [assignee]);

                    // Send email notification to assignee
                    const assigneeProfile = userProfilesCache.find(p =>
                        p.name === assignee || p.email === assignee
                    );
                    if (assigneeProfile && assigneeProfile.email) {
                        sendNotificationEmail(
                            assigneeProfile.email,
                            assigneeProfile.name,
                            'subtask_assigned',
                            entry.title,
                            entryId,
                            {
                                subtask_title: newSubtaskTitle,
                                deadline: newSubtaskDeadline
                            }
                        );
                    }
                }

                closeSubtaskModal();
            };

            // Logo URL for PDF exports (uses APP_CONFIG)
            const PM_LOGO_URL = APP_CONFIG.LOGO_URL;

            // Helper to load image for PDF
            const loadImageForPdf = (url) => {
                return new Promise((resolve, reject) => {
                    const img = new Image();
                    img.crossOrigin = 'Anonymous';
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        canvas.width = img.width;
                        canvas.height = img.height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0);
                        resolve(canvas.toDataURL('image/png'));
                    };
                    img.onerror = () => resolve(null); // Don't fail if logo can't load
                    img.src = url;
                });
            };

            // Status badge colors for PDF
            const STATUS_COLORS = {
                'Idea': { bg: [243, 232, 255], text: [124, 58, 237] },
                'Discovery': { bg: [219, 234, 254], text: [37, 99, 235] },
                'Preparation': { bg: [254, 243, 199], text: [217, 119, 6] },
                'In Delivery': { bg: [207, 250, 254], text: [8, 145, 178] },
                'In Progress': { bg: [207, 250, 254], text: [8, 145, 178] },
                'Delivered': { bg: [209, 250, 229], text: [5, 150, 105] },
                'Ready for Review': { bg: [254, 243, 199], text: [217, 119, 6] },
                'Impact Assessment': { bg: [255, 237, 213], text: [234, 88, 12] },
                'Done': { bg: [187, 247, 208], text: [22, 163, 74] },
                'Draft': { bg: [241, 245, 249], text: [100, 116, 139] }
            };

            // Custom PDF Export Handler
            const handleCustomPdfExport = async () => {
                const { jsPDF } = window.jspdf;
                const options = pdfExportOptions;

                // Save preferences to localStorage
                localStorage.setItem('pdfExportPreferences', JSON.stringify(options));

                // Close modal and show loading
                setShowPdfExportModal(false);

                const loadingOverlay = document.createElement('div');
                loadingOverlay.id = 'pdf-export-loading';
                loadingOverlay.innerHTML = `
                    <div style="position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:9999">
                        <div style="background:white;padding:24px 48px;border-radius:12px;text-align:center">
                            <div style="font-size:18px;font-weight:600;color:#0c4a6e;margin-bottom:8px">Generating PDF...</div>
                            <div style="font-size:14px;color:#64748b">Please wait</div>
                        </div>
                    </div>
                `;
                document.body.appendChild(loadingOverlay);

                try {
                    // Load logo for PDF
                    const logoData = await loadImageForPdf(PM_LOGO_URL);

                    // Filter entries based on options
                    let filteredEntries = entries.filter(entry => {
                        if (entry.archived) return false;
                        if (options.dateRange.preset !== 'all' && options.dateRange.start) {
                            const entryDate = entry.date ? new Date(entry.date) : (entry.timelineValue ? parseTimelineValue(entry.timelineValue) : null);
                            if (entryDate) {
                                const start = new Date(options.dateRange.start);
                                const end = options.dateRange.end ? new Date(options.dateRange.end) : new Date();
                                if (entryDate < start || entryDate > end) return false;
                            }
                        }
                        if (options.statusFilter.length > 0 && !options.statusFilter.includes(entry.workflowStatus)) return false;
                        if (options.memberFilter.length > 0) {
                            const isOwner = options.memberFilter.includes(entry.owner);
                            const isCollaborator = entry.collaborators?.some(c => options.memberFilter.includes(c));
                            if (!isOwner && !isCollaborator) return false;
                        }
                        if (options.teamFilter.length > 0 && !options.teamFilter.includes(entry.team)) return false;
                        return true;
                    });

                    function parseTimelineValue(tv) {
                        if (!tv) return null;
                        if (tv.includes('Q')) {
                            const [year, q] = tv.split('-Q');
                            return new Date(parseInt(year), (parseInt(q) - 1) * 3, 1);
                        }
                        return new Date(tv);
                    }

                    // Create PDF
                    const isLandscape = options.orientation === 'landscape';
                    const pdf = new jsPDF({ orientation: options.orientation, unit: 'mm', format: 'a4' });

                    const pageWidth = isLandscape ? 297 : 210;
                    const pageHeight = isLandscape ? 210 : 297;
                    const margin = 12;
                    const contentWidth = pageWidth - (margin * 2);
                    let yPos = margin;

                    // Colors (matching app's Tailwind palette)
                    const oceanDark = [26, 26, 26];       // graystone-900 for text
                    const oceanMid = [17, 96, 125];       // ocean-500
                    const grayText = [109, 109, 109];     // graystone-600
                    const lightBg = [247, 247, 247];      // graystone-50
                    const cardBorder = [220, 220, 220];   // graystone-200
                    const pageBgColor = [207, 235, 248];   // #CFEBF8 light blue background
                    const cardPadding = 8;

                    // Helper: Draw page background
                    const drawPageBackground = () => {
                        pdf.setFillColor(...pageBgColor);
                        pdf.rect(0, 0, pageWidth, pageHeight, 'F');
                    };

                    // Helper: Draw rounded rectangle
                    const drawRoundedRect = (x, y, w, h, r, fillColor, strokeColor = null) => {
                        pdf.setFillColor(...fillColor);
                        if (strokeColor) pdf.setDrawColor(...strokeColor);
                        pdf.roundedRect(x, y, w, h, r, r, strokeColor ? 'FD' : 'F');
                    };

                    // Helper: Draw white card with shadow
                    const drawCard = (x, y, w, h, r = 4) => {
                        // Shadow
                        pdf.setFillColor(180, 210, 225);
                        pdf.roundedRect(x + 1.5, y + 2, w, h, r, r, 'F');
                        // White card
                        pdf.setFillColor(255, 255, 255);
                        pdf.roundedRect(x, y, w, h, r, r, 'F');
                    };

                    // Draw initial page background
                    drawPageBackground();

                    // Helper: Draw status badge
                    const drawStatusBadge = (status, x, y) => {
                        const colors = STATUS_COLORS[status] || STATUS_COLORS['Draft'];
                        const badgeWidth = pdf.getTextWidth(status) + 6;
                        drawRoundedRect(x, y - 3.5, badgeWidth, 5, 1.5, colors.bg);
                        pdf.setFontSize(7);
                        pdf.setTextColor(...colors.text);
                        pdf.text(status, x + 3, y);
                        return badgeWidth;
                    };

                    // Helper: Draw progress bar
                    const drawProgressBar = (percent, x, y, width) => {
                        const barHeight = 3;
                        // Background
                        drawRoundedRect(x, y, width, barHeight, 1, [226, 232, 240]);
                        // Fill
                        if (percent > 0) {
                            const fillWidth = Math.max(2, (width * percent) / 100);
                            const fillColor = percent >= 100 ? [34, 197, 94] : [14, 165, 233];
                            drawRoundedRect(x, y, fillWidth, barHeight, 1, fillColor);
                        }
                        // Text
                        pdf.setFontSize(6);
                        pdf.setTextColor(...grayText);
                        pdf.text(`${Math.round(percent)}%`, x + width + 2, y + 2.5);
                    };

                    // ===== HEADER SECTION =====
                    const headerHeight = 22;
                    drawRoundedRect(margin, yPos, contentWidth, headerHeight, 3, oceanMid);

                    // Logo on right
                    if (logoData) {
                        try {
                            pdf.addImage(logoData, 'PNG', margin + contentWidth - 35, yPos + 3, 30, 16);
                        } catch (e) { /* ignore logo errors */ }
                    }

                    // Title
                    const title = pdfExportContext === 'manager-hub'
                        ? `${currentUser}'s Team Workstreams`
                        : `${currentUser}'s Dashboard`;
                    pdf.setFontSize(16);
                    pdf.setTextColor(255, 255, 255);
                    pdf.text(title, margin + 8, yPos + 9);

                    // Date
                    pdf.setFontSize(9);
                    pdf.setTextColor(207, 250, 254);
                    pdf.text(`Generated: ${new Date().toLocaleDateString('en-GB', {
                        day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit'
                    })}`, margin + 8, yPos + 16);

                    yPos += headerHeight + 6;

                    // Filter summary pills
                    let filterSummary = [];
                    if (options.dateRange.preset !== 'all') filterSummary.push(`Date: ${options.dateRange.preset}`);
                    if (options.statusFilter.length > 0) filterSummary.push(`Status: ${options.statusFilter.length} selected`);
                    if (options.memberFilter.length > 0) filterSummary.push(`Members: ${options.memberFilter.length}`);
                    if (options.teamFilter.length > 0) filterSummary.push(`Teams: ${options.teamFilter.join(', ')}`);

                    if (filterSummary.length > 0) {
                        let filterX = margin;
                        pdf.setFontSize(7);
                        filterSummary.forEach(filter => {
                            const filterWidth = pdf.getTextWidth(filter) + 6;
                            drawRoundedRect(filterX, yPos, filterWidth, 5, 1.5, [241, 245, 249]);
                            pdf.setTextColor(...grayText);
                            pdf.text(filter, filterX + 3, yPos + 3.5);
                            filterX += filterWidth + 3;
                        });
                        yPos += 10;
                    }

                    // ===== STATISTICS SECTION =====
                    if (options.includeTeamStats) {
                        const totalItems = filteredEntries.length;
                        const inProgress = filteredEntries.filter(e => e.workflowStatus === 'In Delivery' || e.workflowStatus === 'In Progress').length;
                        const completed = filteredEntries.filter(e => e.workflowStatus === 'Done' || e.workflowStatus === 'Delivered').length;
                        const overdue = filteredEntries.filter(e => e.date && new Date(e.date) < new Date()).length;

                        const statBoxWidth = (contentWidth - 9) / 4;
                        const stats = [
                            { label: 'Total', value: totalItems, color: oceanMid },
                            { label: 'In Progress', value: inProgress, color: [14, 165, 233] },
                            { label: 'Completed', value: completed, color: [34, 197, 94] },
                            { label: 'Overdue', value: overdue, color: [239, 68, 68] }
                        ];

                        stats.forEach((stat, i) => {
                            const x = margin + (i * (statBoxWidth + 3));
                            drawCard(x, yPos, statBoxWidth, 16, 2);
                            pdf.setFontSize(18);
                            pdf.setTextColor(...stat.color);
                            pdf.text(String(stat.value), x + 5, yPos + 10);
                            pdf.setFontSize(7);
                            pdf.setTextColor(...grayText);
                            pdf.text(stat.label, x + 5, yPos + 14);
                        });
                        yPos += 22;
                    }

                    // ===== TASKS SECTION =====
                    if (options.includeTaskDetails && filteredEntries.length > 0) {
                        pdf.setFontSize(12);
                        pdf.setTextColor(...oceanDark);
                        pdf.text('Tasks', margin, yPos + 4);
                        yPos += 10;

                        const layoutStyle = options.layoutStyle || 'cards';

                        // CARDS LAYOUT (Clean Style)
                        if (layoutStyle === 'cards') {
                            const cardWidth = isLandscape ? (contentWidth - 6) / 2 : contentWidth;
                            const cardPadding = 8;
                            let col = 0;
                            let rowStartY = yPos;

                            filteredEntries.forEach((entry, idx) => {
                                // Calculate card height
                                let cardHeight = 38; // Base height
                                if (options.viewMode === 'detailed' && entry.caption) cardHeight += 14;

                                // Check for new page
                                if (rowStartY + cardHeight + 2 > pageHeight - margin) {
                                    pdf.addPage();
                                    drawPageBackground();
                                    yPos = margin;
                                    rowStartY = margin;
                                    col = 0;
                                }

                                const x = margin + (col * (cardWidth + 6));
                                const y = rowStartY;

                                // Get status colors
                                const statusColors = STATUS_COLORS[entry.workflowStatus] || STATUS_COLORS['Draft'];

                                // === CARD WITH SHADOW (using drawCard helper) ===
                                drawCard(x, y, cardWidth, cardHeight, 3);

                                // === TITLE ===
                                pdf.setFontSize(12);
                                pdf.setTextColor(...oceanDark);
                                const maxTitleLen = isLandscape ? 40 : 60;
                                const titleText = entry.title.length > maxTitleLen ? entry.title.substring(0, maxTitleLen) + '...' : entry.title;
                                pdf.text(titleText, x + cardPadding, y + 10);

                                // === STATUS BADGE ===
                                const statusText = entry.workflowStatus;
                                const statusWidth = pdf.getTextWidth(statusText) + 6;
                                pdf.setFillColor(...statusColors.bg);
                                pdf.roundedRect(x + cardWidth - cardPadding - statusWidth, y + 5, statusWidth, 7, 2, 2, 'F');
                                pdf.setFontSize(7);
                                pdf.setTextColor(...statusColors.text);
                                pdf.text(statusText, x + cardWidth - cardPadding - statusWidth + 3, y + 10);

                                // === OWNER & TEAM ===
                                pdf.setFontSize(9);
                                pdf.setTextColor(...grayText);
                                pdf.text(`${entry.owner} • ${entry.team}`, x + cardPadding, y + 18);

                                let innerY = 24;

                                // === DESCRIPTION (detailed mode) ===
                                if (options.viewMode === 'detailed' && entry.caption) {
                                    pdf.setFontSize(8);
                                    pdf.setTextColor(...grayText);
                                    const descMaxLen = isLandscape ? 70 : 120;
                                    const desc = entry.caption.length > descMaxLen ? entry.caption.substring(0, descMaxLen) + '...' : entry.caption;
                                    const lines = pdf.splitTextToSize(desc, cardWidth - cardPadding * 2);
                                    lines.slice(0, 2).forEach(line => {
                                        pdf.text(line, x + cardPadding, y + innerY);
                                        innerY += 5;
                                    });
                                }

                                // === BOTTOM ROW INFO ===
                                const bottomY = y + cardHeight - 6;
                                let infoX = x + cardPadding;

                                // Due date
                                if (entry.date) {
