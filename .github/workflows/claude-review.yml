name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip when Claude credentials are unavailable
        if: ${{ env.CLAUDE_CODE_OAUTH_TOKEN == '' && env.ANTHROPIC_API_KEY == '' }}
        run: echo "Skipping Claude review because neither CLAUDE_CODE_OAUTH_TOKEN nor ANTHROPIC_API_KEY is configured."

      - uses: anthropics/claude-code-action@v1
        if: ${{ env.CLAUDE_CODE_OAUTH_TOKEN != '' || env.ANTHROPIC_API_KEY != '' }}
        with:
          github_token: ${{ github.token }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review this PR. Focus on:
            - Code quality and maintainability
            - React 18 patterns and hooks usage
            - Supabase query correctness and RLS implications
            - Tailwind utility class consistency
            - Type safety (TypeScript strictness)
            - Test coverage for new logic
            Keep feedback concise and actionable.
