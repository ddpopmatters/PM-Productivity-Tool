    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ============================================

        // ============================================

        const SUPABASE_CONFIG = {

            SUPABASE_URL: "https://jzalaltexmotkusvqoew.supabase.co",
            SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp6YWxhbHRleG1vdGt1c3Zxb2V3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc4NDAxMDUsImV4cCI6MjA4MzQxNjEwNX0.hr4GB0m7GU2mWS_MBu_8JykWtmRGY_aI6cPe8jjhTx0",

        // ============================================

        // ============================================
        // Seed data for initial setup - actual roles are stored in Supabase user_profiles table
        const SEED_PROFILES = [
            { email: "daniel.davis@populationmatters.org", name: "Dan Davis", team: "Advocacy & Influence", role: "admin" },
            { email: "jameen.kaur@populationmatters.org", name: "Jameen Kaur", team: "Advocacy & Influence", role: "manager" },
            { email: "emma.lewendon-strutt@populationmatters.org", name: "Emma Lewendon-Strutt", team: "Research", role: "member" },
            { email: "josh.hill@populationmatters.org", name: "Josh Hill", team: "Research", role: "member" },
            { email: "francesca.harrison@populationmatters.org", name: "Francesca Harrison", team: "Advocacy & Influence", role: "member" },
            { email: "madeleine.hewitt@populationmatters.org", name: "Madeleine Hewitt", team: "Advocacy & Influence", role: "member" },
            { email: "shweta.shirodkar@populationmatters.org", name: "Shweta Shirodkar", team: "Advocacy & Influence", role: "member" }
        ];

        // Global cache for user profiles loaded from Supabase
        // This gets populated at app startup and updated when roles change
        let userProfilesCache = [];

        // Legacy USERS_CONFIG for backwards compatibility during migration
        const USERS_CONFIG = {
            admins: ["daniel.davis@populationmatters.org"],
            managers: ["daniel.davis@populationmatters.org", "jameen.kaur@populationmatters.org"],
            profiles: [...SEED_PROFILES]
        };

        // Load user profiles cache from Supabase
        const loadUserProfilesCache = async () => {
            if (!supabase) {
                console.log("Supabase not available, using seed profiles");
                userProfilesCache = [...SEED_PROFILES];
                return;
            }
            try {
                const profiles = await SUPABASE_API.fetchUserProfiles();
                if (profiles.length > 0) {
                    userProfilesCache = profiles;
                    console.log(`Loaded ${profiles.length} user profiles from Supabase`);
                } else {
                    // No profiles in DB yet, use seed data
                    userProfilesCache = [...SEED_PROFILES];
                }
            } catch (e) {
                console.error("Failed to load profiles cache:", e);
                userProfilesCache = [...SEED_PROFILES];
            }
        };

        // Helper functions for role checking - checks Supabase cache first, falls back to seed data
        const isAdmin = (email) => {
            if (!email) return false;
            const normalized = email.toLowerCase();
            // Check Supabase cache first
            const cachedProfile = userProfilesCache.find(p => p.email.toLowerCase() === normalized);
            if (cachedProfile) {
                return cachedProfile.role === 'admin';
            }
            // Fallback to seed data
            const seedProfile = SEED_PROFILES.find(p => p.email.toLowerCase() === normalized);
            return seedProfile?.role === 'admin';
        };

        const isManager = (email) => {
            if (!email) return false;
            const normalized = email.toLowerCase();
            // Check Supabase cache first
            const cachedProfile = userProfilesCache.find(p => p.email.toLowerCase() === normalized);
            if (cachedProfile) {
                return cachedProfile.role === 'manager' || cachedProfile.role === 'admin';
            }
            // Fallback to seed data
            const seedProfile = SEED_PROFILES.find(p => p.email.toLowerCase() === normalized);
            return seedProfile?.role === 'manager' || seedProfile?.role === 'admin';
        };

        const getPreseededProfile = (email) => {
            if (!email) return null;
            const normalized = email.toLowerCase();
            // Check cache first, then seed data
            return userProfilesCache.find(p => p.email.toLowerCase() === normalized) ||
                   SEED_PROFILES.find(p => p.email.toLowerCase() === normalized);
        };

        // Get user's role from cache or seed data
        const getUserRole = (email) => {
            if (!email) return 'member';
            const normalized = email.toLowerCase();
            const cachedProfile = userProfilesCache.find(p => p.email.toLowerCase() === normalized);
            if (cachedProfile) return cachedProfile.role || 'member';
            const seedProfile = SEED_PROFILES.find(p => p.email.toLowerCase() === normalized);
            return seedProfile?.role || 'member';
        };

        // Check if user can edit an item (owner or collaborator)
        const canEditItem = (item, userEmail, userName) => {
            if (!item || !userEmail) return false;
            // Owner by email (most secure)
            if (item.ownerEmail && item.ownerEmail.toLowerCase() === userEmail.toLowerCase()) return true;
            // Fallback: owner by name (for legacy items without ownerEmail)
            if (item.owner === userName) return true;
            // Collaborators can also edit
            if (item.collaborators && item.collaborators.includes(userName)) return true;
            return false;
        };

        // Functions to modify roles - now updates Supabase
        const updateUserRole = async (email, newRole) => {
            const normalized = email.toLowerCase().trim();

            // Get old role for logging
            const oldRole = getUserRole(normalized);
            const profile = userProfilesCache.find(p => p.email.toLowerCase() === normalized);

            // Update in Supabase
            if (supabase) {
                const { error } = await supabase
                    .from('user_profiles')
                    .update({ role: newRole, updated_at: new Date().toISOString() })
                    .eq('email', normalized);

                if (error) {
                    console.error('Failed to update role in Supabase:', error);
                    return false;
                }
            }

            // Update local cache
            const cacheIndex = userProfilesCache.findIndex(p => p.email.toLowerCase() === normalized);
            if (cacheIndex >= 0) {
                userProfilesCache[cacheIndex].role = newRole;
            }

            // Update legacy config for backwards compatibility
            if (newRole === 'admin') {
                if (!USERS_CONFIG.admins.includes(normalized)) USERS_CONFIG.admins.push(normalized);
                if (!USERS_CONFIG.managers.includes(normalized)) USERS_CONFIG.managers.push(normalized);
            } else if (newRole === 'manager') {
                USERS_CONFIG.admins = USERS_CONFIG.admins.filter(e => e !== normalized);
                if (!USERS_CONFIG.managers.includes(normalized)) USERS_CONFIG.managers.push(normalized);
            } else {
                USERS_CONFIG.admins = USERS_CONFIG.admins.filter(e => e !== normalized);
                USERS_CONFIG.managers = USERS_CONFIG.managers.filter(e => e !== normalized);
            }

            // Log activity
            if (oldRole !== newRole) {
                logActivity('role_changed', 'user_profile', normalized, profile?.name || normalized, {
                    from_role: oldRole,
                    to_role: newRole
                });
            }

            return true;
        };

        // Legacy functions for backwards compatibility - now wrap updateUserRole
        const addAdmin = async (email) => await updateUserRole(email, 'admin');
        const removeAdmin = async (email) => {
            const currentRole = getUserRole(email);
            if (currentRole === 'admin') {
                await updateUserRole(email, 'manager'); // Demote to manager, not member
            }
        };
        const addManager = async (email) => await updateUserRole(email, 'manager');
        const removeManager = async (email) => {
            const currentRole = getUserRole(email);
            if (currentRole === 'manager') {
                await updateUserRole(email, 'member');
            }
        };

        const addProfile = (profile) => {
            const existing = USERS_CONFIG.profiles.findIndex(p =>
                p.email.toLowerCase() === profile.email.toLowerCase()
            );
            if (existing >= 0) {
                USERS_CONFIG.profiles[existing] = { ...USERS_CONFIG.profiles[existing], ...profile };
            } else {
                USERS_CONFIG.profiles.push(profile);
            }
        };

        // ============================================
        // PDF EXPORT UTILITY
        // ============================================
        const exportToPDF = async (elementId, filename, title) => {
            const { jsPDF } = window.jspdf;
            const element = document.getElementById(elementId);

            if (!element) {
                console.error('Export element not found:', elementId);
                return false;
            }

            try {
                // Show loading state
                const loadingOverlay = document.createElement('div');
                loadingOverlay.id = 'pdf-export-loading';
                loadingOverlay.innerHTML = `
                    <div style="position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:9999">
                        <div style="background:white;padding:24px 48px;border-radius:12px;text-align:center">
                            <div style="font-size:18px;font-weight:600;color:#0c4a6e;margin-bottom:8px">Generating PDF...</div>
                            <div style="font-size:14px;color:#64748b">Please wait</div>
                        </div>
                    </div>
                `;
                document.body.appendChild(loadingOverlay);

                // Capture the element
                const canvas = await html2canvas(element, {
                    scale: 2,
                    useCORS: true,
                    logging: false,
                    backgroundColor: '#f8fafc'
                });

                const imgData = canvas.toDataURL('image/png');
                const imgWidth = canvas.width;
                const imgHeight = canvas.height;

                // Calculate PDF dimensions (A4 landscape for wider content)
                const pdfWidth = 297; // A4 landscape width in mm
                const pdfHeight = 210; // A4 landscape height in mm
                const margin = 10;
                const contentWidth = pdfWidth - (margin * 2);

                // Scale image to fit width
                const ratio = contentWidth / (imgWidth / 2); // Divide by scale factor
                const scaledHeight = (imgHeight / 2) * ratio;

                // Create PDF
                const pdf = new jsPDF({
                    orientation: scaledHeight > pdfHeight ? 'portrait' : 'landscape',
                    unit: 'mm',
                    format: 'a4'
                });

                // Add title
                pdf.setFontSize(16);
                pdf.setTextColor(12, 74, 110); // ocean-900
                pdf.text(title || 'Export', margin, 15);

                // Add date
                pdf.setFontSize(10);
                pdf.setTextColor(100, 116, 139); // graystone-500
                pdf.text(`Generated: ${new Date().toLocaleDateString('en-GB', {
                    day: 'numeric',
                    month: 'long',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                })}`, margin, 22);

                // Calculate how many pages we need
                const pageContentHeight = (pdf.internal.pageSize.getHeight() - 30); // Leave space for header
                const totalPages = Math.ceil(scaledHeight / pageContentHeight);

                // Add image (may span multiple pages)
                if (totalPages === 1) {
                    pdf.addImage(imgData, 'PNG', margin, 28, contentWidth, scaledHeight);
                } else {
                    // Multi-page export
                    let yOffset = 0;
                    for (let page = 0; page < totalPages; page++) {
                        if (page > 0) {
                            pdf.addPage();
                        }

                        const sourceY = (page * pageContentHeight / ratio) * 2; // Convert back to canvas coords
                        const sourceHeight = Math.min((pageContentHeight / ratio) * 2, imgHeight - sourceY);

                        // Create a temporary canvas for this page section
                        const pageCanvas = document.createElement('canvas');
                        pageCanvas.width = imgWidth;
                        pageCanvas.height = sourceHeight;
                        const ctx = pageCanvas.getContext('2d');
                        ctx.drawImage(canvas, 0, sourceY, imgWidth, sourceHeight, 0, 0, imgWidth, sourceHeight);

                        const pageImgData = pageCanvas.toDataURL('image/png');
                        const pageScaledHeight = (sourceHeight / 2) * ratio;

                        pdf.addImage(pageImgData, 'PNG', margin, page === 0 ? 28 : 10, contentWidth, pageScaledHeight);
                    }
                }

                // Save the PDF
                pdf.save(`${filename || 'export'}_${new Date().toISOString().slice(0,10)}.pdf`);

                // Remove loading overlay
                document.body.removeChild(loadingOverlay);
                return true;

            } catch (error) {
                console.error('PDF export error:', error);
                const overlay = document.getElementById('pdf-export-loading');

        let clerkInstance = null;

        const initClerk = async () => {
            if (!AUTH_CONFIG.AUTH_ENABLED) return null;
            if (clerkInstance) return clerkInstance;

            // Check if we're running on file:// protocol (local testing)
            if (window.location.protocol === 'file:') {
                console.warn("Clerk auth disabled: Running on file:// protocol. Deploy to a web server for authentication.");
                return null;
            }

            // Wait for Clerk to be ready (loaded via data-clerk-publishable-key attribute)
            // Clerk auto-initializes when loaded this way
            try {
                // Wait up to 5 seconds for Clerk to load
                let attempts = 0;
                while (!window.Clerk && attempts < 50) {
                    await new Promise(resolve => setTimeout(resolve, 100));
                    attempts++;
                }

                if (!window.Clerk) {
                    console.warn("Clerk SDK not loaded. Authentication will be disabled.");
                    return null;
                }

                // If Clerk is already loaded (as an object, not constructor), use it directly
                if (typeof window.Clerk === 'object' && window.Clerk.load) {
                    clerkInstance = window.Clerk;
                    if (!clerkInstance.loaded) {
                        await clerkInstance.load();
                    }
                    return clerkInstance;
                }

                // Fallback: Clerk might be a constructor (older versions)
                if (typeof window.Clerk === 'function') {
                    clerkInstance = new window.Clerk(AUTH_CONFIG.CLERK_PUBLISHABLE_KEY);
                    await clerkInstance.load();
                    return clerkInstance;
                }

                console.warn("Clerk SDK format not recognized.");
                return null;
            } catch (e) {
                console.error("Failed to initialize Clerk:", e);
                return null;
            }
        };

        // ============================================
        // LOGIN SCREEN COMPONENT
        // ============================================
        function LoginScreen({ onAuthChange }) {
            const [mode, setMode] = useState('signin'); // 'signin', 'signup', 'verify', 'verify-2fa'
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [confirmPassword, setConfirmPassword] = useState('');
            const [verificationCode, setVerificationCode] = useState('');
            const [error, setError] = useState('');
            const [success, setSuccess] = useState('');
            const [loading, setLoading] = useState(false);
            const [clerk, setClerk] = useState(null);
            const [pendingSignUp, setPendingSignUp] = useState(null);
            const [pendingSignIn, setPendingSignIn] = useState(null);

            useEffect(() => {
                initClerk().then(setClerk);
            }, []);

            const handleSignIn = async (e) => {
                e.preventDefault();
                if (!clerk) return;
                setLoading(true);
                setError('');

                try {
                    // Create sign-in with email identifier
                    const trimmedEmail = email.trim().toLowerCase();
                    const signIn = await clerk.client.signIn.create({
                        identifier: trimmedEmail,
                    });

                    // Attempt first factor with password
                    const result = await signIn.attemptFirstFactor({
                        strategy: 'password',
                        password: password,
                    });

                    if (result.status === 'complete') {
                        // No 2FA required, sign in complete
                        await clerk.setActive({ session: result.createdSessionId });
                        onAuthChange(clerk.user);
                    } else if (result.status === 'needs_second_factor') {
                        // 2FA required - prepare email code
                        await result.prepareSecondFactor({
                            strategy: 'email_code',
                        });
                        setPendingSignIn(result);
                        setMode('verify-2fa');
                        setSuccess('Enter the verification code sent to your email.');
                    }
                } catch (err) {
                    console.error('Sign in error:', err);
                    setError(err.errors?.[0]?.message || err.message || 'Sign in failed. Please try again.');
                } finally {
                    setLoading(false);
                }
            };

            const handleVerify2FA = async (e) => {
                e.preventDefault();
                if (!clerk || !pendingSignIn) return;
                setLoading(true);
                setError('');

                try {
                    const result = await pendingSignIn.attemptSecondFactor({
                        strategy: 'email_code',
                        code: verificationCode,
                    });

                    if (result.status === 'complete') {
                        await clerk.setActive({ session: result.createdSessionId });
                        onAuthChange(clerk.user);
                    } else {
                        setError('Verification incomplete. Please try again.');
                    }
                } catch (err) {
                    setError(err.errors?.[0]?.message || 'Invalid verification code. Please try again.');
                } finally {
                    setLoading(false);
                }
            };

            const resendCode2FA = async () => {
                if (!pendingSignIn) return;
                setLoading(true);
                setError('');
                try {
                    await pendingSignIn.prepareSecondFactor({ strategy: 'email_code' });
                    setSuccess('New verification code sent!');
                } catch (err) {
                    setError('Failed to resend code. Please try again.');
                } finally {
                    setLoading(false);
                }
            };

            const handleSignUp = async (e) => {
                e.preventDefault();
                if (!clerk) return;

                // Validate passwords match
                if (password !== confirmPassword) {
                    setError('Passwords do not match.');
                    return;
                }

                setLoading(true);
                setError('');
                setSuccess('');

                try {
                    // Create signup with email and password
                    const result = await clerk.client.signUp.create({
                        emailAddress: email,
                        password: password,
                    });

                    if (result.status === 'complete') {
                        await clerk.setActive({ session: result.createdSessionId });
                        onAuthChange(clerk.user);
                    } else {
                        // Email verification required - prepare and switch to verify mode
                        await result.prepareEmailAddressVerification({ strategy: 'email_code' });
                        setPendingSignUp(result);
                        setMode('verify');
                        setSuccess('Verification code sent! Check your email.');
                    }
                } catch (err) {
                    console.error('Sign up error:', err);
                    setError(err.errors?.[0]?.message || 'Sign up failed. Please try again.');
                } finally {
                    setLoading(false);
                }
            };

            const handleVerifyCode = async (e) => {
                e.preventDefault();
                if (!clerk || !pendingSignUp) return;
                setLoading(true);
                setError('');

                try {
                    const result = await pendingSignUp.attemptEmailAddressVerification({
                        code: verificationCode,
                    });

                    if (result.status === 'complete') {
                        await clerk.setActive({ session: result.createdSessionId });
                        onAuthChange(clerk.user);
                    } else {
                        setError('Verification incomplete. Please try again.');
                    }
                } catch (err) {
                    setError(err.errors?.[0]?.message || 'Invalid verification code. Please try again.');
                } finally {
                    setLoading(false);
                }
            };

            const resendCode = async () => {
                if (!pendingSignUp) return;
                setLoading(true);
                setError('');
                try {
                    await pendingSignUp.prepareEmailAddressVerification({ strategy: 'email_code' });
                    setSuccess('New verification code sent!');
                } catch (err) {
                    setError('Failed to resend code. Please try again.');
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center" style={{ backgroundColor: '#cfebf8' }}>
                    <div className="bg-white rounded-2xl shadow-xl p-8 w-full max-w-md">
                        <div className="text-center mb-8">
                            <h1 className="text-3xl font-bold text-ocean-900 mb-2">Workflow Manager</h1>
                            <p className="text-graystone-600">
                                {mode === 'signin' ? 'Sign in to your account' :
                                 mode === 'signup' ? 'Create your account' :
                                 mode === 'verify-2fa' ? 'Two-factor authentication' :
                                 'Enter verification code'}
                            </p>
                        </div>

                        {error && (
                            <div className="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg mb-4 text-sm">
                                {error}
                            </div>
                        )}

                        {success && (
                            <div className="bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-lg mb-4 text-sm">
                                {success}
                            </div>
                        )}

                        {/* Verification Code Form */}
                        {mode === 'verify' && (
                            <form onSubmit={handleVerifyCode} className="space-y-4">
                                <div>
                                    <label className="block text-sm font-medium text-graystone-700 mb-1">
                                        Verification Code
                                    </label>
                                    <p className="text-xs text-graystone-500 mb-2">
                                        We sent a code to {email}
                                    </p>
                                    <input
                                        type="text"
                                        value={verificationCode}
                                        onChange={(e) => setVerificationCode(e.target.value)}
                                        className="w-full px-4 py-3 border border-graystone-300 rounded-xl focus:ring-2 focus:ring-ocean-500 focus:border-ocean-500 outline-none transition text-center text-2xl tracking-widest"
                                        placeholder="000000"
                                        required
                                        maxLength={6}
                                    />
                                </div>
                                <button
                                    type="submit"
                                    disabled={loading || !clerk || verificationCode.length < 6}
                                    className="w-full bg-ocean-500 text-white py-3 rounded-xl font-semibold hover:bg-ocean-600 disabled:opacity-50 disabled:cursor-not-allowed transition"
                                >
                                    {loading ? 'Verifying...' : 'Verify Email'}
                                </button>
                                <div className="text-center">
                                    <button
                                        type="button"
                                        onClick={resendCode}
                                        disabled={loading}
                                        className="text-sm text-ocean-600 hover:underline"
                                    >
                                        Resend code
                                    </button>
                                    <span className="mx-2 text-graystone-300">|</span>

                                    </button>

                        )}

                        {/* 2FA Verification Form */}
                        {mode === 'verify-2fa' && (
                            <form onSubmit={handleVerify2FA} className="space-y-4">
                                <div>
                                    <label className="block text-sm font-medium text-graystone-700 mb-1">
                                        Verification Code
                                    </label>
                                    <p className="text-xs text-graystone-500 mb-2">
                                        We sent a code to {email}
                                    </p>
                                    <input
                                        type="text"
                                        value={verificationCode}
                                        onChange={(e) => setVerificationCode(e.target.value)}
                                        className="w-full px-4 py-3 border border-graystone-300 rounded-xl focus:ring-2 focus:ring-ocean-500 focus:border-ocean-500 outline-none transition text-center text-2xl tracking-widest"
                                        placeholder="000000"
                                        required
                                        maxLength={6}
                                    />
                                </div>
                                <button
                                    type="submit"
                                    disabled={loading || !clerk || verificationCode.length < 6}
                                    className="w-full bg-ocean-500 text-white py-3 rounded-xl font-semibold hover:bg-ocean-600 disabled:opacity-50 disabled:cursor-not-allowed transition"
                                >
                                    {loading ? 'Verifying...' : 'Verify & Sign In'}
                                </button>
                                <div className="text-center">
                                    <button
                                        type="button"
                                        onClick={resendCode2FA}
                                        disabled={loading}
                                        className="text-sm text-ocean-600 hover:underline"
                                    >
                                        Resend code
                                    </button>
                                    <span className="mx-2 text-graystone-300">|</span>
                                    <button
                                        type="button"
                                        onClick={() => { setMode('signin'); setError(''); setSuccess(''); setPendingSignIn(null); setVerificationCode(''); }}
                                        className="text-sm text-graystone-600 hover:underline"
                                    >
                                        Start over
                                    </button>
                                </div>
                            </form>
                        )}

                        {/* Sign In Form - Email + Password */}
                        {mode === 'signin' && (
                            <form onSubmit={handleSignIn} className="space-y-4">
                                <div>
                                    <label className="block text-sm font-medium text-graystone-700 mb-1 required-indicator">Email</label>
                                    <input
                                        type="email"
                                        value={email}
                                        onChange={(e) => setEmail(e.target.value)}
                                        className="w-full px-4 py-3 border border-graystone-300 rounded-xl focus:ring-2 focus:ring-ocean-500 focus:border-ocean-500 outline-none transition"
                                        placeholder="you@example.com"
                                        required
                                        aria-required="true"
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-graystone-700 mb-1 required-indicator">Password</label>
                                    <input
                                        type="password"
                                        value={password}
                                        onChange={(e) => setPassword(e.target.value)}
                                        className="w-full px-4 py-3 border border-graystone-300 rounded-xl focus:ring-2 focus:ring-ocean-500 focus:border-ocean-500 outline-none transition"
                                        placeholder="••••••••"
                                        required
                                        aria-required="true"
                                        autoComplete="current-password"
                                    />
                                </div>
                                <button
                                    type="submit"
                                    disabled={loading || !clerk}
                                    className="w-full bg-ocean-500 text-white py-3 rounded-xl font-semibold hover:bg-ocean-600 disabled:opacity-50 disabled:cursor-not-allowed transition"
                                >
                                    {loading ? 'Signing in...' : 'Sign In'}
                                </button>
                            </form>
                        )}

                        {/* Sign Up Form - Email + Password */}
                        {mode === 'signup' && (
                            <form onSubmit={handleSignUp} className="space-y-4">
                                <div>
                                    <label className="block text-sm font-medium text-graystone-700 mb-1 required-indicator">Email</label>
                                    <input
                                        type="email"
                                        value={email}
                                        onChange={(e) => setEmail(e.target.value)}
                                        className="w-full px-4 py-3 border border-graystone-300 rounded-xl focus:ring-2 focus:ring-ocean-500 focus:border-ocean-500 outline-none transition"
                                        placeholder="you@example.com"
                                        required
                                        aria-required="true"
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-graystone-700 mb-1 required-indicator">Password</label>
                                    <input
                                        type="password"
                                        value={password}
                                        onChange={(e) => setPassword(e.target.value)}
                                        className="w-full px-4 py-3 border border-graystone-300 rounded-xl focus:ring-2 focus:ring-ocean-500 focus:border-ocean-500 outline-none transition"
                                        placeholder="••••••••"
                                        required
                                        aria-required="true"
                                        minLength={8}
                                        autoComplete="new-password"
                                    />
                                    {password && password.length < 8 && (
                                        <p className="validation-message validation-error">Password must be at least 8 characters</p>
                                    )}
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-graystone-700 mb-1 required-indicator">Confirm Password</label>
                                    <input
                                        type="password"
                                        value={confirmPassword}
                                        onChange={(e) => setConfirmPassword(e.target.value)}
                                        className={`w-full px-4 py-3 border border-graystone-300 rounded-xl focus:ring-2 focus:ring-ocean-500 focus:border-ocean-500 outline-none transition ${confirmPassword && password !== confirmPassword ? 'input-error' : ''}`}
                                        placeholder="••••••••"
                                        required
                                        aria-required="true"
                                        minLength={8}
                                        autoComplete="new-password"
                                    />
                                    {confirmPassword && password !== confirmPassword && (
                                        <p className="validation-message validation-error">Passwords do not match</p>
                                    )}
                                </div>
                                <button
                                    type="submit"
                                    disabled={loading || !clerk}
                                    className="w-full bg-ocean-500 text-white py-3 rounded-xl font-semibold hover:bg-ocean-600 disabled:opacity-50 disabled:cursor-not-allowed transition"
                                >
                                    {loading ? 'Please wait...' : 'Create Account'}
                                </button>
                            </form>
                        )}

                        {(mode === 'signin' || mode === 'signup') && (
                            <div className="mt-6 text-center">
                                {mode === 'signin' ? (
                                    <p className="text-sm text-graystone-600">
                                        Don't have an account?{' '}
                                        <button
                                            onClick={() => { setMode('signup'); setError(''); }}
                                            className="text-ocean-600 font-semibold hover:underline"
                                        >
                                            Sign up
                                        </button>
                                    </p>
                                ) : (
                                    <p className="text-sm text-graystone-600">
                                        Already have an account?{' '}
                                        <button
                                            onClick={() => { setMode('signin'); setError(''); }}
                                            className="text-ocean-600 font-semibold hover:underline"
                                        >
                                            Sign in
                                        </button>
                                    </p>
                                )}
                            </div>
                        )}

                        {!clerk && AUTH_CONFIG.AUTH_ENABLED && (
                            <div className="mt-4 text-center text-sm text-amber-600">
                                Loading authentication...
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // ============================================
        // ADMIN CONSOLE COMPONENT
        // ============================================
        function AdminConsole({ onBack, currentUserEmail, onConfigChange }) {
            const [activeTab, setActiveTab] = useState('invites'); // 'invites', 'admins', 'managers', 'profiles'
            const [inviteEmail, setInviteEmail] = useState('');
            const [invites, setInvites] = useState([]);
            const [sending, setSending] = useState(false);
            const [sendingEmail, setSendingEmail] = useState(null); // Track which profile is being invited
            const [message, setMessage] = useState({ type: '', text: '' });
            const [clerk, setClerk] = useState(null);

            // For adding new admins/managers
            const [newAdminEmail, setNewAdminEmail] = useState('');
            const [newManagerEmail, setNewManagerEmail] = useState('');

            // For adding new profiles
            const [newProfile, setNewProfile] = useState({ email: '', name: '', team: TEAMS[0], role: 'member' });

            // Claimed user profiles from Supabase
            const [claimedProfiles, setClaimedProfiles] = useState([]);
            const [loadingProfiles, setLoadingProfiles] = useState(true);

            // Activity log state
            const [activityLog, setActivityLog] = useState([]);
            const [loadingActivity, setLoadingActivity] = useState(false);
            const [activityFilter, setActivityFilter] = useState('all'); // 'all', 'login', 'created', 'status_changed', etc.

            // Force re-render when config changes
            const [, forceUpdate] = useState(0);

            useEffect(() => {
                initClerk().then(setClerk);
            }, []);

            // Load claimed profiles from Supabase
            useEffect(() => {
                async function loadClaimedProfiles() {
                    setLoadingProfiles(true);
                    const profiles = await SUPABASE_API.fetchUserProfiles();
                    setClaimedProfiles(profiles);
                    setLoadingProfiles(false);
                }
                loadClaimedProfiles();
            }, []);

            // Load activity log when activity tab is selected
            useEffect(() => {
                if (activeTab !== 'activity') return;

                async function loadActivityLog() {
                    setLoadingActivity(true);
                    const activities = await SUPABASE_API.fetchRecentActivity(100);
                    setActivityLog(activities);
                    setLoadingActivity(false);
                }
                loadActivityLog();
            }, [activeTab]);

            // Get list of claimed emails for quick lookup
            const claimedEmails = claimedProfiles.map(p => p.email.toLowerCase());

            // Filter pre-seeded profiles into pending (not claimed)
            const pendingProfiles = USERS_CONFIG.profiles.filter(
                p => !claimedEmails.includes(p.email.toLowerCase())
            );

            const handleSendInvite = async (e) => {
                e.preventDefault();
                if (!inviteEmail.trim()) return;

                setSending(true);
                setMessage({ type: '', text: '' });

                try {
                    // Call Supabase Edge Function to send Clerk invite
                    const response = await fetch(
                        `${SUPABASE_CONFIG.SUPABASE_URL}/functions/v1/send-clerk-invite`,
                        {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${SUPABASE_CONFIG.SUPABASE_ANON_KEY}`,
                            },
                            body: JSON.stringify({
                                email: inviteEmail.toLowerCase().trim(),
                                redirectUrl: window.location.origin + window.location.pathname,
                                publicMetadata: {
                                    invitedBy: currentUserEmail,
                                    invitedAt: new Date().toISOString()
                                }
                            }),
                        }
                    );

                    const result = await response.json();

                    if (!result.success) {
                        throw new Error(result.error || 'Failed to send invitation');
                    }

                    // Add to pre-seeded profiles if not exists
                    if (!getPreseededProfile(inviteEmail)) {
                        addProfile({
                            email: inviteEmail.toLowerCase().trim(),
                            name: inviteEmail.split('@')[0].replace(/[._]/g, ' ').replace(/\b\w/g, c => c.toUpperCase()),
                            team: TEAMS[0],
                            role: 'member'
                        });
                    }

                    setInvites(prev => [...prev, {
                        email: inviteEmail,
                        sentAt: new Date().toISOString(),
                        status: 'sent'
                    }]);

                    // Log activity
                    logActivity('invite_sent', 'user_profile', inviteEmail, inviteEmail, {
                        invited_by: currentUserEmail
                    });

                    setMessage({ type: 'success', text: `Invitation email sent to ${inviteEmail}!` });
                    setInviteEmail('');
                    forceUpdate(n => n + 1);
                } catch (error) {
                    console.error('Invite error:', error);
                    setMessage({ type: 'error', text: error.message || 'Failed to send invitation' });
                } finally {
                    setSending(false);
                }
            };

            // Send invite directly for a profile (used by profile invite buttons)
            const handleSendProfileInvite = async (email, name) => {
                if (!email) return;

                setSendingEmail(email);
                setMessage({ type: '', text: '' });

                try {
                    const response = await fetch(
                        `${SUPABASE_CONFIG.SUPABASE_URL}/functions/v1/send-clerk-invite`,
                        {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${SUPABASE_CONFIG.SUPABASE_ANON_KEY}`,
                            },
                            body: JSON.stringify({
                                email: email.toLowerCase().trim(),
                                redirectUrl: window.location.origin + window.location.pathname,
                                publicMetadata: {
                                    invitedBy: currentUserEmail,
                                    invitedAt: new Date().toISOString(),
                                    profileName: name
                                }
                            }),
                        }
                    );

                    const result = await response.json();

                    if (!result.success) {
                        throw new Error(result.error || 'Failed to send invitation');
                    }

                    setInvites(prev => [...prev, {
                        email: email,
                        sentAt: new Date().toISOString(),
                        status: 'sent'
                    }]);

                    // Log activity
                    logActivity('invite_sent', 'user_profile', email, name, {
                        invited_by: currentUserEmail
                    });

                    setMessage({ type: 'success', text: `Invitation sent to ${name} (${email})!` });
                } catch (error) {
                    console.error('Invite error:', error);
                    setMessage({ type: 'error', text: error.message || 'Failed to send invitation' });
                } finally {
                    setSendingEmail(null);
                }
            };

            // Check if an email has been invited
            const isInvited = (email) => {
                return invites.some(inv => inv.email.toLowerCase() === email.toLowerCase());
            };

            const handleAddAdmin = async (e) => {
                e.preventDefault();
                if (!newAdminEmail.trim()) return;
                const success = await addAdmin(newAdminEmail);
                if (success) {
                    setMessage({ type: 'success', text: `${newAdminEmail} promoted to admin` });
                    // Reload profiles to reflect change
                    const profiles = await SUPABASE_API.fetchUserProfiles();
                    setClaimedProfiles(profiles);
                } else {
                    setMessage({ type: 'error', text: `Failed to promote ${newAdminEmail}` });
                }
                setNewAdminEmail('');
                forceUpdate(n => n + 1);
            };

            const handleRemoveAdmin = async (email) => {
                if (email.toLowerCase() === currentUserEmail.toLowerCase()) {
                    setMessage({ type: 'error', text: "You cannot remove yourself as admin" });
                    return;
                }
                await removeAdmin(email);
                setMessage({ type: 'success', text: `${email} demoted to manager` });
                // Reload profiles to reflect change
                const profiles = await SUPABASE_API.fetchUserProfiles();
                setClaimedProfiles(profiles);
                forceUpdate(n => n + 1);
            };

            const handleAddManager = async (e) => {
                e.preventDefault();
                if (!newManagerEmail.trim()) return;
                const success = await addManager(newManagerEmail);
                if (success) {
                    setMessage({ type: 'success', text: `${newManagerEmail} promoted to manager` });
                    // Reload profiles to reflect change
                    const profiles = await SUPABASE_API.fetchUserProfiles();
                    setClaimedProfiles(profiles);
                } else {
                    setMessage({ type: 'error', text: `Failed to promote ${newManagerEmail}` });
                }
                setNewManagerEmail('');
                forceUpdate(n => n + 1);
            };

            const handleRemoveManager = async (email) => {
                await removeManager(email);
                setMessage({ type: 'success', text: `${email} demoted to member` });
                // Reload profiles to reflect change
                const profiles = await SUPABASE_API.fetchUserProfiles();
                setClaimedProfiles(profiles);
                forceUpdate(n => n + 1);
            };

            const handleAddProfile = (e) => {
                e.preventDefault();
                if (!newProfile.email.trim() || !newProfile.name.trim()) return;
                addProfile(newProfile);
                setMessage({ type: 'success', text: `Profile created for ${newProfile.name}` });
                setNewProfile({ email: '', name: '', team: TEAMS[0], role: 'member' });
                forceUpdate(n => n + 1);
            };

            if (!isAdmin(currentUserEmail)) {
                return (
                    <div className="max-w-2xl mx-auto text-center py-12">
                        <div className="bg-red-50 border border-red-200 rounded-2xl p-8">
                            <i data-lucide="shield-x" className="w-16 h-16 text-red-400 mx-auto mb-4"></i>
                            <h2 className="text-2xl font-bold text-red-700 mb-2">Access Denied</h2>
                            <p className="text-red-600 mb-4">You don't have permission to access the admin console.</p>
                            <button
                                onClick={onBack}
                                className="px-6 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition"
                            >
                                Go Back
                            </button>
                        </div>
                    </div>
                );
            }

            const tabs = [
                { id: 'invites', label: 'Invitations', icon: 'mail-plus' },
                { id: 'admins', label: 'Admins', icon: 'shield' },
                { id: 'managers', label: 'Managers', icon: 'briefcase' },
                { id: 'profiles', label: 'User Profiles', icon: 'users' },
                { id: 'activity', label: 'Activity Log', icon: 'activity' },
            ];

            return (
                <div className="max-w-5xl mx-auto">
                    <div className="bg-white rounded-2xl shadow-sm border border-ocean-100 overflow-hidden">
                        {/* Header */}
                        <div className="bg-gradient-to-r from-ocean-500 to-ocean-600 p-6 text-white">
                            <div className="flex items-center justify-between">
                                <div>
                                    <h1 className="text-2xl font-bold mb-1">Admin Console</h1>
                                    <p className="text-ocean-100 text-sm">Manage users, roles, and permissions</p>
                                </div>
                                <button
                                    onClick={onBack}
                                    className="px-4 py-2 bg-white/20 hover:bg-white/30 rounded-lg transition flex items-center gap-2"
                                >
                                    <i data-lucide="arrow-left" className="w-4 h-4"></i>
                                    Back
                                </button>
                            </div>
                        </div>

                        {/* Tabs */}
                        <div className="border-b border-graystone-200">
                            <div className="flex gap-1 p-2">
                                {tabs.map(tab => (
                                    <button
                                        key={tab.id}
                                        onClick={() => { setActiveTab(tab.id); setMessage({ type: '', text: '' }); }}
                                        className={cx(
                                            "flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium transition",
                                            activeTab === tab.id
                                                ? "bg-ocean-500 text-white"
                                                : "text-graystone-600 hover:bg-graystone-100"
                                        )}
                                    >
                                        <i data-lucide={tab.icon} className="w-4 h-4"></i>
                                        {tab.label}
                                    </button>
                                ))}
                            </div>
                        </div>

                        <div className="p-6">
                            {/* Message */}
                            {message.text && (
                                <div className={`mb-4 px-4 py-3 rounded-lg text-sm ${
                                    message.type === 'success'
                                        ? 'bg-green-50 border border-green-200 text-green-700'
                                        : 'bg-red-50 border border-red-200 text-red-700'
                                }`}>
                                    {message.text}
                                </div>
                            )}

                            {/* Invitations Tab */}
                            {activeTab === 'invites' && (
                                <div className="space-y-6">
                                    <div>
                                        <h2 className="text-lg font-bold text-ocean-900 mb-4">Send Invitation</h2>
                                        <form onSubmit={handleSendInvite} className="flex gap-3">
                                            <input
                                                type="email"
                                                value={inviteEmail}
                                                onChange={(e) => setInviteEmail(e.target.value)}
                                                placeholder="colleague@populationmatters.org"
                                                className="flex-1 px-4 py-3 border border-graystone-300 rounded-xl focus:ring-2 focus:ring-ocean-500 focus:border-ocean-500 outline-none transition"
                                                required
                                            />
                                            <button
                                                type="submit"
                                                disabled={sending || !inviteEmail.trim()}
                                                className="px-6 py-3 bg-ocean-500 text-white rounded-xl font-semibold hover:bg-ocean-600 disabled:opacity-50 disabled:cursor-not-allowed transition flex items-center gap-2"
                                            >
                                                <i data-lucide="send" className="w-4 h-4"></i>
                                                Send Invite
                                            </button>
                                        </form>
                                        <p className="text-xs text-graystone-500 mt-2">
                                            This will create a pre-seeded profile. Add the user in Clerk Dashboard to send the actual invitation email.
                                        </p>
                                    </div>

                                    <div>
                                        <h3 className="font-semibold text-ocean-900 mb-3">Recent Invitations</h3>
                                        {invites.length === 0 ? (
                                            <div className="text-center py-8 bg-graystone-50 rounded-xl border border-graystone-200">
                                                <p className="text-graystone-500 text-sm">No invitations sent yet</p>
                                            </div>
                                        ) : (
                                            <div className="space-y-2">
                                                {invites.map((invite, idx) => (
                                                    <div key={idx} className="flex items-center justify-between p-3 bg-graystone-50 rounded-lg border border-graystone-200">
                                                        <span className="text-sm">{invite.email}</span>
                                                        <span className="px-2 py-1 bg-amber-100 text-amber-700 rounded text-xs">{invite.status}</span>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>

                                    <div className="bg-ocean-50 rounded-xl p-4 border border-ocean-100">
                                        <a
                                            href="https://dashboard.clerk.com"
                                            target="_blank"
                                            rel="noopener noreferrer"
                                            className="inline-flex items-center gap-2 text-sm font-medium text-ocean-600 hover:text-ocean-800"
                                        >
                                            <i data-lucide="external-link" className="w-4 h-4"></i>
                                            Open Clerk Dashboard for full user management
                                        </a>
                                    </div>
                                </div>
                            )}

                            {/* Admins Tab */}
                            {activeTab === 'admins' && (
                                <div className="space-y-6">
                                    <div>
                                        <h2 className="text-lg font-bold text-ocean-900 mb-2">Administrators</h2>
                                        <p className="text-sm text-graystone-600 mb-4">Admins have full access to the Admin Console and can manage all users.</p>

                                        <form onSubmit={handleAddAdmin} className="flex gap-3 mb-4">
                                            <input
                                                type="email"
                                                value={newAdminEmail}
                                                onChange={(e) => setNewAdminEmail(e.target.value)}
                                                placeholder="new-admin@populationmatters.org"
                                                className="flex-1 px-4 py-3 border border-graystone-300 rounded-xl focus:ring-2 focus:ring-ocean-500 focus:border-ocean-500 outline-none transition"
                                                required
                                            />
                                            <button
                                                type="submit"
                                                disabled={!newAdminEmail.trim()}
                                                className="px-6 py-3 bg-amber-500 text-white rounded-xl font-semibold hover:bg-amber-600 disabled:opacity-50 transition flex items-center gap-2"
                                            >
                                                <i data-lucide="user-plus" className="w-4 h-4"></i>
                                                Promote to Admin
                                            </button>
                                        </form>

                                        <div className="space-y-2">
                                            {claimedProfiles.filter(p => p.role === 'admin').map((profile) => (
                                                <div key={profile.id || profile.email} className="flex items-center justify-between p-4 bg-amber-50 rounded-xl border border-amber-200">
                                                    <div className="flex items-center gap-3">
                                                        <div className="w-10 h-10 rounded-full bg-amber-500 text-white flex items-center justify-center font-bold">
                                                            <i data-lucide="shield" className="w-5 h-5"></i>
                                                        </div>
                                                        <div>
                                                            <div className="font-medium text-ocean-900">{profile.name}</div>
                                                            <div className="text-xs text-graystone-500">
                                                                {profile.email.toLowerCase() === currentUserEmail.toLowerCase() ? `${profile.email} (You)` : profile.email}
                                                            </div>
                                                        </div>
                                                    </div>
                                                    {profile.email.toLowerCase() !== currentUserEmail.toLowerCase() && (
                                                        <button
                                                            onClick={() => handleRemoveAdmin(profile.email)}
                                                            className="px-3 py-1 text-red-600 hover:bg-red-50 rounded-lg transition text-sm"
                                                        >
                                                            Demote
                                                        </button>
                                                    )}
                                                </div>
                                            ))}
                                            {claimedProfiles.filter(p => p.role === 'admin').length === 0 && (
                                                <div className="text-center py-8 text-graystone-500 bg-graystone-50 rounded-xl border border-graystone-200">
                                                    No admins found. Add one above.
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* Managers Tab */}
                            {activeTab === 'managers' && (
                                <div className="space-y-6">
                                    <div>
                                        <h2 className="text-lg font-bold text-ocean-900 mb-2">Manager Hub Access</h2>
                                        <p className="text-sm text-graystone-600 mb-4">Users with manager access can view the Manager Hub and see team workloads.</p>

                                        <form onSubmit={handleAddManager} className="flex gap-3 mb-4">
                                            <input
                                                type="email"
                                                value={newManagerEmail}
                                                onChange={(e) => setNewManagerEmail(e.target.value)}

        // Utility
        const cx = (...xs) => xs.filter(Boolean).join(" ");
        const uuid = () => Math.random().toString(36).slice(2) + Date.now().toString(36);

        // ============================================
        // ERROR BOUNDARY COMPONENT
        // ============================================
        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null, errorInfo: null };
            }

            static getDerivedStateFromError(error) {
                return { hasError: true };
            }

            componentDidCatch(error, errorInfo) {
                this.setState({ error, errorInfo });
                console.error('ErrorBoundary caught an error:', error, errorInfo);
            }

            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen bg-graystone-100 flex items-center justify-center p-8">
                            <div className="max-w-lg w-full bg-white rounded-2xl shadow-lg p-8 text-center">
                                <div className="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
                                    <svg className="w-8 h-8 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                                    </svg>
                                </div>
                                <h1 className="text-2xl font-bold text-ocean-900 mb-2">Something went wrong</h1>
                                <p className="text-graystone-600 mb-6">
                                    The application encountered an unexpected error. Please try refreshing the page.
                                </p>
                                <div className="space-y-3">
                                    <button
                                        onClick={() => window.location.reload()}
                                        className="w-full px-6 py-3 bg-ocean-500 text-white rounded-xl font-semibold hover:bg-ocean-600 transition"
                                    >
                                        Refresh Page
                                    </button>
                                    <button
                                        onClick={() => this.setState({ hasError: false, error: null, errorInfo: null })}
                                        className="w-full px-6 py-3 bg-graystone-200 text-graystone-700 rounded-xl font-semibold hover:bg-graystone-300 transition"
                                    >
                                        Try Again
                                    </button>
                                </div>
                                {this.state.error && (
                                    <details className="mt-6 text-left">
                                        <summary className="text-sm text-graystone-500 cursor-pointer hover:text-graystone-700">
                                            Technical details
                                        </summary>
                                        <pre className="mt-2 p-3 bg-graystone-100 rounded-lg text-xs text-red-600 overflow-auto max-h-40">
                                            {this.state.error.toString()}
                                            {this.state.errorInfo?.componentStack}
                                        </pre>
                                    </details>
                                )}
                            </div>
                        </div>
                    );
                }

                return this.props.children;
            }
        }

        // ============================================
        // NOTIFICATIONS PANEL COMPONENT
        // ============================================
        function NotificationsPanel({ isOpen, onClose, notifications, onNotificationClick }) {
            const formatTimeAgo = (timestamp) => {
                const now = new Date();
                const date = new Date(timestamp);
                const seconds = Math.floor((now - date) / 1000);

                if (seconds < 60) return 'just now';
                if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;
                if (seconds < 86400) return `${Math.floor(seconds / 3600)}h ago`;
                if (seconds < 604800) return `${Math.floor(seconds / 86400)}d ago`;
                return date.toLocaleDateString();
            };

            const getActivityIcon = (actionType) => {
                switch (actionType) {
                    case 'created': return 'plus-circle';
                    case 'status_changed': return 'refresh-cw';
                    case 'comment_added': return 'message-circle';
                    case 'subtask_added': return 'list-plus';
                    case 'subtask_completed': return 'check-circle';
                    case 'subtask_uncompleted': return 'circle';
                    case 'description_updated': return 'edit-3';
                    case 'invite_sent': return 'user-plus';
                    case 'role_changed': return 'shield';
                    case 'login': return 'log-in';
                    default: return 'activity';
                }
            };

            const getActivityMessage = (notification) => {
                const { action_type, actor_name, target_title, details } = notification;
                const actor = actor_name || 'Someone';

                switch (action_type) {
                    case 'created':
                        return `${actor} created "${target_title}"`;
                    case 'status_changed':
                        return `${actor} moved "${target_title}" to ${details?.to_status || 'a new status'}`;
                    case 'comment_added':
                        return `${actor} commented on "${target_title}"`;
                    case 'subtask_added':
                        return `${actor} added a subtask to "${target_title}"`;
                    case 'subtask_completed':
                        return `${actor} completed a subtask in "${target_title}"`;
                    case 'subtask_uncompleted':
                        return `${actor} reopened a subtask in "${target_title}"`;
                    case 'description_updated':
                        return `${actor} updated the description of "${target_title}"`;
                    case 'invite_sent':
                        return `${actor} sent you an invitation`;
                    case 'role_changed':
                        return `Your role was changed to ${details?.to_role || 'a new role'}`;
                    default:
                        return `${actor} performed an action on "${target_title}"`;
                }
            };

            useEffect(() => {
                if (isOpen && typeof lucide !== 'undefined') {
                    setTimeout(() => lucide.createIcons(), 50);
                }
            }, [isOpen, notifications]);

            if (!isOpen) return null;

            return (
                <div
                    className="fixed inset-0 z-50 flex items-start justify-end pt-16 pr-4"
                    role="dialog"
                    aria-modal="true"
                    aria-labelledby="notifications-panel-title"
                >
                    <div
                        className="fixed inset-0 bg-black/20"
                        onClick={onClose}
